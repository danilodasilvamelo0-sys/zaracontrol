<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZARA | Todo Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-hover: #242424;
            --gold: #d4af7d;
            --gold-dim: #a88f63;
            --gold-glow: rgba(212, 175, 125, 0.1);
            --text: #e0e0e0;
            --text-dim: #a0a0a0;
            --text-muted: #707070;
            --border: #2a2a2a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --info: #2196f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 2.5em;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9em;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: var(--surface-hover);
            border-color: var(--gold);
            color: var(--gold);
        }

        .nav-btn.active {
            background: var(--gold-glow);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Add Task Section */
        .add-task {
            background: var(--surface);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-full {
            grid-column: 1 / -1;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn {
            padding: 12px 30px;
            background: var(--gold);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--gold-dim);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            color: var(--gold);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85em;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--gold-glow);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Todo List */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .todo-item {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            align-items: start;
            transition: all 0.3s ease;
        }

        .todo-item:hover {
            border-color: var(--gold);
            background: var(--surface-hover);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .todo-checkbox:hover {
            border-color: var(--gold);
        }

        .todo-checkbox.checked {
            background: var(--gold);
            border-color: var(--gold);
        }

        .todo-checkbox.checked::after {
            content: '✓';
            color: var(--bg);
            font-size: 16px;
            font-weight: bold;
        }

        .todo-content {
            flex: 1;
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .todo-title {
            font-size: 1.1em;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 5px;
        }

        .todo-description {
            color: var(--text-dim);
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .todo-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.priority-high {
            background: rgba(244, 67, 54, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .badge.priority-medium {
            background: rgba(255, 152, 0, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .badge.priority-low {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge.category {
            background: var(--gold-glow);
            color: var(--gold);
            border: 1px solid var(--gold-dim);
        }

        .todo-date {
            color: var(--text-muted);
            font-size: 0.8em;
        }

        .todo-date.overdue {
            color: var(--danger);
            font-weight: 500;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8em;
        }

        .action-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .action-btn.delete:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
                letter-spacing: 4px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TODO</h1>
            <p class="subtitle">Gerenciador de Tarefas</p>
        </header>

        <div class="nav">
            <a href="index.html" class="nav-btn">← Voltar</a>
            <a href="financeiro.html" class="nav-btn">Financeiro</a>
            <a href="saude.html" class="nav-btn">Saúde</a>
            <a href="Diario.html" class="nav-btn">Diário</a>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeTasks">0</div>
                <div class="stat-label">Ativas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Concluídas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="overdueTasks">0</div>
                <div class="stat-label">Atrasadas</div>
            </div>
        </div>

        <div class="add-task">
            <h3 style="margin-bottom: 20px; color: var(--gold);">Nova Tarefa</h3>
            <div class="input-group">
                <input type="text" id="taskTitle" placeholder="Título da tarefa" class="input-full">
                <textarea id="taskDescription" placeholder="Descrição (opcional)" class="input-full"></textarea>
                <select id="taskPriority">
                    <option value="low">Prioridade Baixa</option>
                    <option value="medium" selected>Prioridade Média</option>
                    <option value="high">Prioridade Alta</option>
                </select>
                <select id="taskCategory">
                    <option value="pessoal">Pessoal</option>
                    <option value="trabalho">Trabalho</option>
                    <option value="saude">Saúde</option>
                    <option value="financeiro">Financeiro</option>
                    <option value="estudos">Estudos</option>
                    <option value="outros">Outros</option>
                </select>
                <input type="date" id="taskDueDate">
                <button class="btn" onclick="addTask()">Adicionar Tarefa</button>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterTasks('all')">Todas</button>
            <button class="filter-btn" onclick="filterTasks('active')">Ativas</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Concluídas</button>
            <button class="filter-btn" onclick="filterTasks('high')">Alta Prioridade</button>
            <button class="filter-btn" onclick="filterTasks('overdue')">Atrasadas</button>
        </div>

        <div class="todo-list" id="todoList">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                <p>Nenhuma tarefa ainda. Adicione sua primeira tarefa acima!</p>
            </div>
        </div>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('zara_todos') || '[]');
        let currentFilter = 'all';

        function saveTodos() {
            localStorage.setItem('zara_todos', JSON.stringify(todos));
            renderTodos();
            updateStats();
        }

        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) {
                alert('Por favor, adicione um título para a tarefa');
                return;
            }

            const task = {
                id: Date.now(),
                title: title,
                description: document.getElementById('taskDescription').value.trim(),
                priority: document.getElementById('taskPriority').value,
                category: document.getElementById('taskCategory').value,
                dueDate: document.getElementById('taskDueDate').value,
                completed: false,
                createdAt: new Date().toISOString()
            };

            todos.unshift(task);
            saveTodos();

            // Clear form
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('taskDueDate').value = '';
            document.getElementById('taskPriority').value = 'medium';
            document.getElementById('taskCategory').value = 'pessoal';
        }

        function toggleTask(id) {
            const task = todos.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTodos();
            }
        }

        function deleteTask(id) {
            if (confirm('Tem certeza que deseja excluir esta tarefa?')) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
            }
        }

        function editTask(id) {
            const task = todos.find(t => t.id === id);
            if (!task) return;

            const newTitle = prompt('Novo título:', task.title);
            if (newTitle !== null && newTitle.trim()) {
                task.title = newTitle.trim();
                saveTodos();
            }
        }

        function isOverdue(dueDate) {
            if (!dueDate) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(dueDate);
            return due < today;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR');
        }

        function filterTasks(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderTodos();
        }

        function getFilteredTodos() {
            switch (currentFilter) {
                case 'active':
                    return todos.filter(t => !t.completed);
                case 'completed':
                    return todos.filter(t => t.completed);
                case 'high':
                    return todos.filter(t => t.priority === 'high' && !t.completed);
                case 'overdue':
                    return todos.filter(t => !t.completed && isOverdue(t.dueDate));
                default:
                    return todos;
            }
        }

        function renderTodos() {
            const filteredTodos = getFilteredTodos();
            const todoList = document.getElementById('todoList');

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        <p>Nenhuma tarefa encontrada.</p>
                    </div>
                `;
                return;
            }

            todoList.innerHTML = filteredTodos.map(task => `
                <div class="todo-item ${task.completed ? 'completed' : ''}">
                    <div class="todo-checkbox ${task.completed ? 'checked' : ''}"
                         onclick="toggleTask(${task.id})"></div>
                    <div class="todo-content">
                        <div class="todo-header">
                            <div>
                                <div class="todo-title">${task.title}</div>
                                ${task.description ? `<div class="todo-description">${task.description}</div>` : ''}
                            </div>
                            <div class="todo-actions">
                                <button class="action-btn" onclick="editTask(${task.id})">Editar</button>
                                <button class="action-btn delete" onclick="deleteTask(${task.id})">Excluir</button>
                            </div>
                        </div>
                        <div class="todo-meta">
                            <span class="badge priority-${task.priority}">${
                                task.priority === 'high' ? 'Alta' :
                                task.priority === 'medium' ? 'Média' : 'Baixa'
                            }</span>
                            <span class="badge category">${task.category}</span>
                            ${task.dueDate ? `
                                <span class="todo-date ${!task.completed && isOverdue(task.dueDate) ? 'overdue' : ''}">
                                    ${!task.completed && isOverdue(task.dueDate) ? '⚠ Atrasada - ' : '📅 '}
                                    ${formatDate(task.dueDate)}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const total = todos.length;
            const active = todos.filter(t => !t.completed).length;
            const completed = todos.filter(t => t.completed).length;
            const overdue = todos.filter(t => !t.completed && isOverdue(t.dueDate)).length;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('activeTasks').textContent = active;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('overdueTasks').textContent = overdue;
        }

        // Enter key to add task
        document.getElementById('taskTitle').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Initial render
        renderTodos();
        updateStats();
    </script>
</body>
</html>
