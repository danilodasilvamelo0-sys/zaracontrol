<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLAD — Conselheiro de Guerra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 50%,#0f0f1a 100%);min-height:100vh;color:#e0e0e0;overflow-x:hidden}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(circle at 20% 50%,rgba(139,0,0,.08) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(75,0,130,.08) 0%,transparent 50%);pointer-events:none;z-index:0}
        .header{background:linear-gradient(180deg,rgba(20,20,35,.98) 0%,rgba(15,15,25,.95) 100%);border-bottom:2px solid rgba(139,0,0,.5);padding:15px 30px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
        .header-left{display:flex;align-items:center;gap:20px}
        .back-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,rgba(139,0,0,.2) 0%,rgba(80,0,0,.3) 100%);border:1px solid rgba(139,0,0,.4);border-radius:8px;color:#d4af7d;font-size:.85em;font-weight:500;text-decoration:none;text-transform:uppercase;letter-spacing:1px;transition:all .3s}
        .back-btn:hover{background:linear-gradient(135deg,rgba(139,0,0,.4) 0%,rgba(100,0,0,.5) 100%);border-color:rgba(212,175,125,.5);transform:translateX(-3px)}
        .back-btn svg{width:16px;height:16px}
        .logo{font-family:'Cinzel',serif;font-size:1.2em;font-weight:600;color:#d4af7d;letter-spacing:3px}
        .header-right{display:flex;align-items:center;gap:15px}
        .api-status{display:flex;align-items:center;gap:8px;padding:8px 15px;background:rgba(0,0,0,.3);border:1px solid rgba(139,0,0,.3);border-radius:20px;font-size:.8em}
        .api-status.connected{border-color:rgba(0,150,0,.4)}
        .status-dot{width:8px;height:8px;border-radius:50%;animation:pulse 2s infinite}
        .status-dot.green{background:#4ade80}
        .status-dot.yellow{background:#fbbf24}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .config-btn{padding:8px 15px;background:transparent;border:1px solid rgba(212,175,125,.3);border-radius:8px;color:#d4af7d;font-size:.8em;cursor:pointer;transition:all .3s}
        .config-btn:hover{background:rgba(212,175,125,.1);border-color:#d4af7d}
        .main-container{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:20px;height:calc(100vh - 70px);display:flex;flex-direction:column}
        .chat-container{flex:1;background:linear-gradient(135deg,rgba(20,20,35,.95) 0%,rgba(15,15,25,.98) 100%);border:1px solid rgba(139,0,0,.4);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
        .chat-header{display:flex;justify-content:space-between;align-items:center;padding:20px 25px;background:linear-gradient(180deg,rgba(139,0,0,.2) 0%,rgba(80,0,0,.1) 100%);border-bottom:1px solid rgba(139,0,0,.3)}
        .chat-header-left{display:flex;align-items:center;gap:15px}
        .chat-avatar{width:50px;height:50px;background:linear-gradient(135deg,#8b0000 0%,#4a0000 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5em;border:2px solid rgba(212,175,125,.4)}
        .chat-info h3{font-family:'Cinzel',serif;font-size:1.2em;color:#d4af7d;letter-spacing:2px}
        .chat-info p{font-size:.8em;color:rgba(224,224,224,.5);margin-top:2px}
        .chat-actions{display:flex;gap:10px}
        .chat-action-btn{padding:8px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(139,0,0,.3);border-radius:8px;color:rgba(224,224,224,.7);font-size:.8em;cursor:pointer;transition:all .3s}
        .chat-action-btn:hover{background:rgba(139,0,0,.2);color:#d4af7d}
        .chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
        .chat-messages::-webkit-scrollbar{width:6px}
        .chat-messages::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
        .chat-messages::-webkit-scrollbar-thumb{background:rgba(139,0,0,.5);border-radius:3px}
        .message{max-width:85%;padding:15px 20px;border-radius:16px;line-height:1.6;font-size:.95em;animation:fadeIn .3s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .message.user{align-self:flex-end;background:linear-gradient(135deg,rgba(139,0,0,.4) 0%,rgba(80,0,0,.5) 100%);border:1px solid rgba(139,0,0,.5);color:#fff}
        .message.assistant{align-self:flex-start;background:rgba(30,30,50,.8);border:1px solid rgba(212,175,125,.2);color:rgba(224,224,224,.95)}
        .message.assistant .msg-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(212,175,125,.1)}
        .message.assistant .msg-header span{font-family:'Cinzel',serif;font-size:.85em;color:#d4af7d;letter-spacing:1px}
        .message.system{align-self:center;background:rgba(75,0,130,.2);border:1px solid rgba(75,0,130,.3);color:rgba(224,224,224,.7);font-size:.85em;text-align:center;max-width:90%}
        .message.error{background:rgba(150,0,0,.2);border:1px solid rgba(150,0,0,.4);color:#ff6b6b}
        .message pre{background:rgba(0,0,0,.4);padding:12px;border-radius:8px;overflow-x:auto;margin:10px 0;font-size:.85em}
        .message code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;font-size:.9em}
        .typing-indicator{display:flex;align-items:center;gap:8px;padding:15px 20px;background:rgba(30,30,50,.6);border:1px solid rgba(212,175,125,.1);border-radius:16px;align-self:flex-start}
        .typing-indicator span{font-size:.85em;color:rgba(224,224,224,.5)}
        .typing-dots{display:flex;gap:4px}
        .typing-dots div{width:8px;height:8px;background:#d4af7d;border-radius:50%;animation:bounce 1.4s infinite}
        .typing-dots div:nth-child(2){animation-delay:.2s}
        .typing-dots div:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
        .chat-input-container{padding:20px;background:rgba(0,0,0,.3);border-top:1px solid rgba(139,0,0,.2)}
        .chat-input-wrapper{display:flex;gap:12px;align-items:flex-end}
        .chat-input{flex:1;padding:15px 20px;background:rgba(20,20,35,.8);border:1px solid rgba(139,0,0,.3);border-radius:12px;color:#fff;font-family:'Inter',sans-serif;font-size:.95em;resize:none;min-height:50px;max-height:150px;transition:all .3s}
        .chat-input:focus{outline:none;border-color:rgba(212,175,125,.5);box-shadow:0 0 20px rgba(139,0,0,.2)}
        .chat-input::placeholder{color:rgba(224,224,224,.3)}
        .send-btn{padding:15px 25px;background:linear-gradient(135deg,rgba(139,0,0,.5) 0%,rgba(80,0,0,.6) 100%);border:1px solid rgba(139,0,0,.6);border-radius:12px;color:#d4af7d;font-size:.9em;font-weight:500;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:8px}
        .send-btn:hover:not(:disabled){background:linear-gradient(135deg,rgba(139,0,0,.7) 0%,rgba(100,0,0,.8) 100%);border-color:#d4af7d;transform:translateY(-2px);box-shadow:0 5px 20px rgba(139,0,0,.4)}
        .send-btn:disabled{opacity:.5;cursor:not-allowed}
        .send-btn svg{width:18px;height:18px}
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center}
        .modal-overlay.active{display:flex}
        .modal{background:linear-gradient(135deg,#1a1a2e 0%,#0f0f1a 100%);border:1px solid rgba(139,0,0,.5);border-radius:16px;padding:30px;max-width:500px;width:90%}
        .modal h2{font-family:'Cinzel',serif;color:#d4af7d;margin-bottom:20px;letter-spacing:2px}
        .modal-field{margin-bottom:20px}
        .modal-field label{display:block;margin-bottom:8px;color:rgba(224,224,224,.8);font-size:.9em}
        .modal-field input,.modal-field select{width:100%;padding:12px 15px;background:rgba(0,0,0,.4);border:1px solid rgba(139,0,0,.3);border-radius:8px;color:#fff;font-size:.9em}
        .modal-field input:focus,.modal-field select:focus{outline:none;border-color:rgba(212,175,125,.5)}
        .modal-field small{display:block;margin-top:5px;color:rgba(224,224,224,.4);font-size:.8em}
        .modal-buttons{display:flex;gap:10px;margin-top:25px}
        .modal-btn{flex:1;padding:12px 20px;border-radius:8px;font-size:.9em;cursor:pointer;transition:all .3s}
        .modal-btn.primary{background:linear-gradient(135deg,rgba(139,0,0,.5) 0%,rgba(80,0,0,.6) 100%);border:1px solid rgba(139,0,0,.6);color:#d4af7d}
        .modal-btn.primary:hover{background:linear-gradient(135deg,rgba(139,0,0,.7) 0%,rgba(100,0,0,.8) 100%)}
        .modal-btn.secondary{background:transparent;border:1px solid rgba(224,224,224,.3);color:rgba(224,224,224,.7)}
        .modal-btn.secondary:hover{border-color:rgba(224,224,224,.5);color:#fff}
        .welcome-message{text-align:center;padding:40px 20px;color:rgba(224,224,224,.5)}
        .welcome-message .icon{font-size:4em;margin-bottom:20px;opacity:.5}
        .welcome-message h3{font-family:'Cinzel',serif;color:#d4af7d;margin-bottom:10px;letter-spacing:2px}
        .welcome-message p{max-width:400px;margin:0 auto;line-height:1.6}
        @media(max-width:768px){.header{padding:12px 15px;flex-direction:column;gap:10px}.header-left,.header-right{width:100%;justify-content:center}.main-container{padding:10px;height:calc(100vh - 120px)}.chat-header{flex-direction:column;gap:15px;padding:15px}.message{max-width:95%}.chat-input-wrapper{flex-direction:column}.send-btn{width:100%;justify-content:center}}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="comando.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Painel
            </a>
            <div class="logo">VLAD</div>
        </div>
        <div class="header-right">
            <div class="api-status" id="apiStatus">
                <div class="status-dot yellow" id="statusDot"></div>
                <span id="statusText">Configurar API</span>
            </div>
            <button class="config-btn" onclick="openConfig()">⚙️ Config</button>
        </div>
    </header>

    <main class="main-container">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-avatar">🦇</div>
                    <div class="chat-info">
                        <h3>VLAD</h3>
                        <p>Conselheiro de Guerra • IA Estratégica</p>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="chat-action-btn" onclick="clearChat()">🗑️ Limpar</button>
                    <button class="chat-action-btn" onclick="exportChat()">📥 Exportar</button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="icon">🦇</div>
                    <h3>Zona de Inteligência</h3>
                    <p>Você entrou no canal direto com Vlad. Configure sua API Key da OpenAI nas configurações para começar.</p>
                </div>
            </div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea class="chat-input" id="chatInput" placeholder="Fale com Vlad sobre suas estratégias..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        Enviar
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="configModal">
        <div class="modal">
            <h2>⚙️ Configurações</h2>
            <div class="modal-field">
                <label>API Key da OpenAI</label>
                <input type="password" id="apiKeyInput" placeholder="sk-...">
                <small>Sua chave é salva apenas no seu navegador</small>
            </div>
            <div class="modal-field">
                <label>Modelo</label>
                <select id="modelSelect">
                    <option value="gpt-4o">GPT-4o (Recomendado)</option>
                    <option value="gpt-4o-mini">GPT-4o Mini (Rápido)</option>
                    <option value="gpt-4-turbo">GPT-4 Turbo</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                </select>
            </div>
            <div class="modal-field">
                <label>Personalidade</label>
                <select id="personalitySelect">
                    <option value="estrategico">🎯 Estrategista Sombrio</option>
                    <option value="mentor">📚 Mentor Sábio</option>
                    <option value="brutal">⚔️ Conselheiro Brutal</option>
                    <option value="analitico">🔍 Analista Frio</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn secondary" onclick="closeConfig()">Cancelar</button>
                <button class="modal-btn primary" onclick="saveConfig()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
const STORAGE_KEY='vlad_config',CHAT_STORAGE='vlad_chat';
let config=JSON.parse(localStorage.getItem(STORAGE_KEY))||{apiKey:'',model:'gpt-4o',personality:'estrategico'};
let chatHistory=JSON.parse(localStorage.getItem(CHAT_STORAGE))||[];
let isProcessing=false;

const personalities={
estrategico:`Você é VLAD, um conselheiro de guerra sombrio e estratégico. Fala como um general antigo. Respostas diretas, metáforas de guerra e batalhas, foco em estratégia de longo prazo. Chama o usuário de "Comandante".`,
mentor:`Você é VLAD, um mentor sábio das sombras. Combina sabedoria antiga com pragmatismo. Cita filosofia e história. Guia sem impor.`,
brutal:`Você é VLAD, brutalmente honesto. Não suaviza verdades. Aponta falhas diretamente. Desafia desculpas. Exige ação.`,
analitico:`Você é VLAD, analista frio e calculista. Respostas estruturadas e lógicas. Prós, contras e probabilidades. Remove emoção.`
};

document.addEventListener('DOMContentLoaded',()=>{updateStatus();loadHistory();autoResize();});

function updateStatus(){
    const dot=document.getElementById('statusDot'),txt=document.getElementById('statusText');
    if(config.apiKey){dot.className='status-dot green';txt.textContent='Conectado';}
    else{dot.className='status-dot yellow';txt.textContent='Configurar API';}
}

function openConfig(){
    document.getElementById('apiKeyInput').value=config.apiKey;
    document.getElementById('modelSelect').value=config.model;
    document.getElementById('personalitySelect').value=config.personality;
    document.getElementById('configModal').classList.add('active');
}

function closeConfig(){document.getElementById('configModal').classList.remove('active');}

function saveConfig(){
    config.apiKey=document.getElementById('apiKeyInput').value.trim();
    config.model=document.getElementById('modelSelect').value;
    config.personality=document.getElementById('personalitySelect').value;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(config));
    updateStatus();closeConfig();
    if(config.apiKey)addMsg('system','🔐 API configurada. Vlad está pronto.');
}

function loadHistory(){
    if(chatHistory.length===0)return;
    document.getElementById('chatMessages').innerHTML='';
    chatHistory.forEach(m=>addToDOM(m.role,m.content,false));
    scrollBottom();
}

function addMsg(role,content,save=true){
    if(save){chatHistory.push({role,content,ts:Date.now()});localStorage.setItem(CHAT_STORAGE,JSON.stringify(chatHistory));}
    addToDOM(role,content);scrollBottom();
}

function addToDOM(role,content,anim=true){
    const c=document.getElementById('chatMessages');
    const w=c.querySelector('.welcome-message');if(w)w.remove();
    const d=document.createElement('div');d.className='message '+role;
    if(!anim)d.style.animation='none';
    if(role==='assistant'){
        d.innerHTML='<div class="msg-header"><span>🦇 VLAD</span></div><div class="msg-content">'+fmt(content)+'</div>';
    }else{d.innerHTML=fmt(content);}
    c.appendChild(d);
}

function fmt(t){
    let f=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    f=f.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
    f=f.replace(/`([^`]+)`/g,'<code>$1</code>');
    f=f.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    f=f.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    return f.replace(/\n/g,'<br>');
}

function showTyping(){
    const c=document.getElementById('chatMessages');
    const i=document.createElement('div');i.className='typing-indicator';i.id='typing';
    i.innerHTML='<div class="typing-dots"><div></div><div></div><div></div></div><span>Vlad analisa...</span>';
    c.appendChild(i);scrollBottom();
}

function hideTyping(){const i=document.getElementById('typing');if(i)i.remove();}
function scrollBottom(){const c=document.getElementById('chatMessages');c.scrollTop=c.scrollHeight;}

async function sendMessage(){
    const inp=document.getElementById('chatInput'),msg=inp.value.trim();
    if(!msg||isProcessing)return;
    if(!config.apiKey){addMsg('system','⚠️ Configure sua API Key da OpenAI.');openConfig();return;}
    addMsg('user',msg);inp.value='';inp.style.height='auto';
    isProcessing=true;document.getElementById('sendBtn').disabled=true;showTyping();
    try{
        const res=await fetch('https://api.openai.com/v1/chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.apiKey},
            body:JSON.stringify({
                model:config.model,
                messages:[{role:'system',content:personalities[config.personality]},...chatHistory.filter(m=>m.role!=='system').slice(-20).map(m=>({role:m.role,content:m.content}))],
                max_tokens:2000,temperature:0.8
            })
        });
        hideTyping();
        if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Erro API');}
        const data=await res.json();
        addMsg('assistant',data.choices[0].message.content);
    }catch(e){hideTyping();addMsg('error','❌ '+e.message);}
    finally{isProcessing=false;document.getElementById('sendBtn').disabled=false;}
}

function handleKeyDown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

function autoResize(){
    const t=document.getElementById('chatInput');
    t.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px';});
}

function clearChat(){
    if(confirm('Limpar histórico?')){
        chatHistory=[];localStorage.removeItem(CHAT_STORAGE);
        document.getElementById('chatMessages').innerHTML='<div class="welcome-message"><div class="icon">🦇</div><h3>Zona de Inteligência</h3><p>Histórico limpo. Inicie nova sessão.</p></div>';
    }
}

function exportChat(){
    if(!chatHistory.length){alert('Nada para exportar.');return;}
    let t='=== VLAD ===\n'+new Date().toLocaleString('pt-BR')+'\n\n';
    chatHistory.forEach(m=>{t+='['+new Date(m.ts).toLocaleTimeString('pt-BR')+'] '+(m.role==='user'?'VOCÊ':m.role==='assistant'?'VLAD':'SISTEMA')+':\n'+m.content+'\n\n';});
    const b=new Blob([t],{type:'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='vlad_'+Date.now()+'.txt';a.click();URL.revokeObjectURL(u);
}
    </script>
</body>
</html>
