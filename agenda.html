/* ========== ZARA SUPER PREMIUM - LUXURY DESIGN SYSTEM ========== */
:root {
    --black: #040404;
    --black-rich: #080808;
    --surface: #0c0c0c;
    --surface2: #111111;
    --surface3: #161616;
    
    /* Gold Premium Palette */
    --gold: #c9a55c;
    --gold-light: #d4b06a;
    --gold-dark: #a08040;
    --gold-glow: rgba(201, 165, 92, 0.08);
    --gold-border: rgba(201, 165, 92, 0.15);
    --gold-hover: rgba(201, 165, 92, 0.12);
    
    /* Text */
    --text: #f5f5f5;
    --text-dim: rgba(245, 245, 245, 0.55);
    --text-muted: rgba(245, 245, 245, 0.35);
}

/* ========== SIDEBAR LUXURY ========== */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 64px;
    height: 100vh;
    background: linear-gradient(180deg, var(--black) 0%, var(--surface) 100%);
    border-right: 1px solid var(--gold-border);
    z-index: 1000;
    box-shadow: 4px 0 30px rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    overflow: hidden;
}

.sidebar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        var(--gold-dark) 20%, 
        var(--gold) 50%, 
        var(--gold-dark) 80%, 
        transparent 100%
    );
    opacity: 0.6;
}

.sidebar::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
}

.sidebar:hover {
    width: 220px;
}

.sidebar-logo {
    width: 44px;
    height: 44px;
    background: var(--black);
    border: 1px solid var(--gold-border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.4em;
    font-weight: 500;
    color: var(--gold);
    margin-bottom: 30px;
    flex-shrink: 0;
    text-decoration: none;
    position: relative;
    transition: all 0.4s ease;
    letter-spacing: 1px;
}

.sidebar-logo:hover {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(201, 165, 92, 0.15);
}

.sidebar-menu {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    flex: 1;
    padding: 0 8px;
}

.sidebar-menu a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 12px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85em;
    font-weight: 400;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    border-radius: 8px;
    white-space: nowrap;
    position: relative;
}

.sidebar-menu a::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 0;
    background: var(--gold);
    border-radius: 2px;
    transition: height 0.3s ease;
}

.sidebar-menu a:hover::before,
.sidebar-menu a.active::before {
    height: 60%;
}

.sidebar-menu a:hover {
    background: var(--gold-glow);
    color: var(--text);
}

.sidebar-menu a.active {
    background: var(--gold-hover);
    color: var(--gold);
}

.sidebar-menu a svg {
    width: 20px;
    height: 20px;
    min-width: 20px;
    stroke: var(--gold);
    opacity: 0.7;
    transition: all 0.3s ease;
}

.sidebar-menu a:hover svg,
.sidebar-menu a.active svg {
    opacity: 1;
}

.sidebar-menu a span {
    opacity: 0;
    transition: opacity 0.3s ease 0.1s;
    font-weight: 400;
}

.sidebar:hover .sidebar-menu a span {
    opacity: 1;
}

.sidebar-footer {
    padding: 20px 12px;
    text-align: center;
    border-top: 1px solid var(--gold-border);
    width: 100%;
    margin-top: auto;
}

.sidebar-footer p {
    color: var(--text-muted);
    font-size: 0.65em;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    line-height: 1.8;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.sidebar-footer .instituto {
    font-family: 'Playfair Display', serif;
    font-size: 1.1em;
    font-weight: 500;
    color: var(--gold);
    display: block;
    margin-bottom: 4px;
    letter-spacing: 3px;
}

.sidebar:hover .sidebar-footer p {
    opacity: 1;
}

/* ========== MOBILE NAVIGATION LUXURY ========== */
.mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, var(--surface) 0%, var(--black) 100%);
    border-top: 1px solid var(--gold-border);
    padding: 12px 0 10px;
    z-index: 1000;
}

.mobile-nav::before {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.4;
}

.mobile-nav-items {
    display: flex;
    justify-content: space-around;
    align-items: center;
    max-width: 500px;
    margin: 0 auto;
}

.mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.58em;
    font-weight: 500;
    padding: 8px 14px;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.mobile-nav-item svg {
    width: 22px;
    height: 22px;
    stroke: var(--gold);
    opacity: 0.5;
    transition: all 0.3s ease;
}

.mobile-nav-item.active {
    color: var(--gold);
}

.mobile-nav-item.active svg {
    opacity: 1;
}

.mobile-nav-item:hover svg {
    opacity: 0.8;
}

/* ========== BODY LUXURY ACCENTS ========== */
body {
    background: var(--black) !important;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent 0%,
        var(--gold-dark) 15%,
        var(--gold) 35%,
        var(--gold-light) 50%,
        var(--gold) 65%,
        var(--gold-dark) 85%,
        transparent 100%
    );
    background-size: 200% 100%;
    animation: goldShimmer 8s ease-in-out infinite;
    z-index: 9999;
}

@keyframes goldShimmer {
    0%, 100% { background-position: 200% 0; }
    50% { background-position: -200% 0; }
}

body::after {
    content: '';
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
    z-index: 9999;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
    body {
        padding: 15px !important;
        padding-bottom: 90px !important;
        padding-left: 15px !important;
    }
    .sidebar { display: none !important; }
    .mobile-nav { display: block !important; }
    .container { margin-left: 0 !important; }
}

@media (min-width: 769px) {
    body { 
        padding-left: 85px !important; 
    }
    .mobile-nav { display: none !important; }
}

/* ========== LUXURY ENHANCEMENTS ========== */
.container {
    background: var(--surface) !important;
    border: 1px solid var(--gold-border) !important;
}

.header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--black-rich) 100%) !important;
    border-bottom: 1px solid var(--gold-border) !important;
}

.header h1 {
    color: var(--gold) !important;
    font-family: 'Playfair Display', serif !important;
    letter-spacing: 4px !important;
}

/* Buttons refinement */
.btn-primary, .btn-gold {
    background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-dark) 100%) !important;
    border: none !important;
    color: var(--black) !important;
}

/* ========== END SUPER PREMIUM DESIGN SYSTEM ========== */

</style>

    <div class="page">

            <div class="cat-pill" data-cat="familiar" onclick="setCat('familiar',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="12" height="12" style="vertical-align:-1px;margin-right:2px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Familiar</div>

            <div class="modal-title">Editar Compromisso</div>
            <input type="text" id="eTexto" class="new-task-input" style="margin-bottom:10px;">
            <div class="field-grid cols-2" style="margin-bottom:10px;"><div><div class="field-label">Categoria</div><select id="eCat" class="field-select"><option value="pessoal">Pessoal</option><option value="executiva">Executiva</option><option value="familiar">Familiar</option><option value="performance">Performance</option><option value="desenvolvimento">Desenvolvimento</option></select></div><div><div class="field-label">Prioridade</div><select id="ePri" class="field-select"><option value="alta">Alta</option><option value="media">Media</option><option value="baixa">Baixa</option></select></div></div>
            <div class="field-grid cols-2" style="margin-bottom:10px;"><div><div class="field-label">Data</div><input type="date" id="eData" class="field-input"></div><div><div class="field-label">Hora</div><input type="time" id="eHora" class="field-input"></div></div>
            <input type="text" id="eNota" placeholder="Nota..." class="new-task-input" style="margin-bottom:14px;font-size:.8em;">
            <div style="display:flex;gap:8px;"><button class="btn-add-task" onclick="saveEdit()" style="flex:1;">Salvar</button><button class="btn-add-task" onclick="closeEdit()" style="flex:0;padding:14px 20px;background:transparent;border-color:rgba(255,255,255,.1);color:var(--text-dim);">Cancelar</button></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
<script>
var K='agendaZara',AG={tasks:[]},filtro='todas',editId=null;
var catN={pessoal:'Pessoal',executiva:'Executiva',familiar:'Familiar',performance:'Performance',desenvolvimento:'Desenv.'};
var catC={pessoal:'var(--blue)',executiva:'var(--gold)',familiar:'var(--green)',performance:'var(--red)',desenvolvimento:'var(--purple)'};
var priN={alta:'Alta',media:'Media',baixa:'Baixa'};
function load(){try{var s=localStorage.getItem(K);if(s){AG=JSON.parse(s);if(!AG.tasks)AG.tasks=[];}}catch(e){AG={tasks:[]};}}
function save(){try{localStorage.setItem(K,JSON.stringify(AG));}catch(e){}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function setCat(c,el){filtro=c;document.querySelectorAll('.cat-pill').forEach(function(p){p.classList.remove('active');});el.classList.add('active');render();}
function addTask(){var tx=document.getElementById('tTexto').value.trim();if(!tx)return;AG.tasks.push({id:Date.now().toString(),texto:tx,cat:document.getElementById('tCat').value,prioridade:document.getElementById('tPri').value,data:document.getElementById('tData').value,hora:document.getElementById('tHora').value,nota:document.getElementById('tNota').value.trim(),done:false,criado:new Date().toISOString()});save();document.getElementById('tTexto').value='';document.getElementById('tNota').value='';render();toast('Compromisso adicionado');}
function toggle(id){var t=AG.tasks.find(function(x){return x.id===id;});if(t){t.done=!t.done;save();render();}}
function del(id){AG.tasks=AG.tasks.filter(function(x){return x.id!==id;});save();render();}
function openEdit(id){var t=AG.tasks.find(function(x){return x.id===id;});if(!t)return;editId=id;document.getElementById('eTexto').value=t.texto;document.getElementById('eCat').value=t.cat;document.getElementById('ePri').value=t.prioridade;document.getElementById('eData').value=t.data||'';document.getElementById('eHora').value=t.hora||'';document.getElementById('eNota').value=t.nota||'';document.getElementById('editModal').classList.add('show');}
function closeEdit(){document.getElementById('editModal').classList.remove('show');editId=null;}
function saveEdit(){var t=AG.tasks.find(function(x){return x.id===editId;});if(!t)return;t.texto=document.getElementById('eTexto').value.trim();t.cat=document.getElementById('eCat').value;t.prioridade=document.getElementById('ePri').value;t.data=document.getElementById('eData').value;t.hora=document.getElementById('eHora').value;t.nota=document.getElementById('eNota').value.trim();save();closeEdit();render();toast('Atualizado');}
function toggleDone(){var el=document.getElementById('doneList');var tg=document.getElementById('doneToggle');var open=el.style.display==='none';el.style.display=open?'block':'none';tg.classList.toggle('open',open);}
function fmtDate(d){if(!d)return '';var p=d.split('-');var ms=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];var dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];var dt=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));return dias[dt.getDay()]+', '+parseInt(p[2])+' '+ms[parseInt(p[1])];}
var chkSvg='<svg viewBox="0 0 24 24" fill="none" stroke="#070707" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
var edSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
var dlSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
var calSvg2='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
function renderT(t,isDone){return '<div class="task-item pri-'+t.prioridade+(isDone?' done':'')+'"><div class="check-round'+(isDone?' checked':'')+'" onclick="toggle(\''+t.id+'\')">'+chkSvg+'</div><div class="task-body"><div class="task-text">'+t.texto+'</div><div class="task-meta"><span class="task-badge badge-'+t.cat+'">'+catN[t.cat]+'</span><span class="task-priority pri-txt-'+t.prioridade+'">'+priN[t.prioridade]+'</span>'+(t.hora?'<span class="task-time">'+t.hora+'</span>':'')+(t.nota?'<span class="task-note">'+t.nota+'</span>':'')+'</div></div><div class="task-actions">'+(!isDone?'<button class="act-btn" onclick="openEdit(\''+t.id+'\')">'+edSvg+'</button>':'')+'<button class="act-btn delete" onclick="del(\''+t.id+'\')">'+dlSvg+'</button></div></div>';}
function render(){
    var pend=AG.tasks.filter(function(t){return !t.done;});var done=AG.tasks.filter(function(t){return t.done;});
    if(filtro!=='todas'){pend=pend.filter(function(t){return t.cat===filtro;});done=done.filter(function(t){return t.cat===filtro;});}
    var priOrd={alta:0,media:1,baixa:2};pend.sort(function(a,b){if(priOrd[a.prioridade]!==priOrd[b.prioridade])return priOrd[a.prioridade]-priOrd[b.prioridade];if(a.data&&b.data)return a.data.localeCompare(b.data);if(a.data)return -1;return 1;});
    var sEl=document.getElementById('statsRow');var cats=['pessoal','executiva','familiar','performance','desenvolvimento'];
    sEl.innerHTML=cats.map(function(c){var p=AG.tasks.filter(function(t){return t.cat===c&&!t.done;}).length;return '<div class="stat-card"><div class="stat-num" style="color:'+catC[c]+';">'+p+'</div><div class="stat-lbl">'+catN[c]+'</div></div>';}).join('');
    var grupos={};pend.forEach(function(t){var g=t.data||'_sem';if(!grupos[g])grupos[g]=[];grupos[g].push(t);});
    var keys=Object.keys(grupos).sort(function(a,b){if(a==='_sem')return 1;if(b==='_sem')return -1;return a.localeCompare(b);});
    var lEl=document.getElementById('taskList');
    if(!keys.length){lEl.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-ghost);font-family:\'Cormorant Garamond\',serif;font-size:1em;font-style:italic;">Nenhum compromisso pendente.</div>';}
    else{lEl.innerHTML=keys.map(function(k){var label=k==='_sem'?'Sem data':fmtDate(k);return '<div class="day-group"><div class="day-label">'+calSvg2+' '+label+'</div>'+grupos[k].map(function(t){return renderT(t,false);}).join('')+'</div>';}).join('');}
    document.getElementById('doneCount').textContent=done.length;
    var dEl=document.getElementById('doneList');dEl.innerHTML=done.length?done.slice(-15).reverse().map(function(t){return renderT(t,true);}).join(''):'<div style="text-align:center;padding:15px;color:var(--text-ghost);font-size:.8em;">Nenhum.</div>';
}
var hoje=new Date();var meses=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];var dias=['Domingo','Segunda-feira','Terca-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sabado'];
document.getElementById('dateDisplay').textContent=dias[hoje.getDay()]+', '+hoje.getDate()+' de '+meses[hoje.getMonth()]+' '+hoje.getFullYear();
document.getElementById('tData').value=hoje.toISOString().split('T')[0];
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeEdit();});
load();render();
</script>
