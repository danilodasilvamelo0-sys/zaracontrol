<div class="container">

    <!-- Header da página -->
    <div class="page-header">
        <div class="header-left">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </div>
            <div>
                <h1 class="page-title">NOTAS</h1>
                <p class="page-sub" id="notasSub">0 notas</p>
            </div>
        </div>
        <button class="btn-primary" onclick="novaNota()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova Nota
        </button>
    </div>

    <!-- Layout 3 colunas -->
    <div class="notas-layout">

        <!-- COLUNA CATEGORIAS -->
        <div class="col-cats">
            <div class="col-header">
                <div class="col-header-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    Categorias
                </div>
                <button class="icon-btn" onclick="abrirModalCat()" title="Nova categoria">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
            <div class="cats-list" id="catsList"></div>
        </div>

        <!-- COLUNA LISTA DE NOTAS -->
        <div class="col-notas">
            <div class="col-header">
                <div class="col-header-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    <span id="colListaTitulo">Todas</span>
                </div>
                <!-- Busca -->
                <div class="busca-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="busca-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="busca-input" id="buscaInput" placeholder="Buscar...">
                </div>
            </div>
            <div class="notas-lista" id="notasLista"></div>
        </div>

        <!-- COLUNA EDITOR -->
        <div class="col-editor">
            <!-- Editor vazio -->
            <div class="editor-vazio" id="editorVazio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                <h3>Selecione uma nota</h3>
                <p>Ou clique em <strong>Nova Nota</strong> para começar.</p>
            </div>

            <!-- Editor ativo -->
            <div class="editor-ativo" id="editorAtivo" style="display:none">
                <!-- Toolbar -->
                <div class="editor-toolbar">
                    <div class="editor-toolbar-left">
                        <!-- Categoria -->
                        <div class="editor-cat-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;color:var(--text-dim)"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <select class="editor-cat-sel" id="editorCatSel" onchange="onCatChange(this)"></select>
                        </div>
                        <span class="editor-salvo" id="editorSalvo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;"><polyline points="20 6 9 17 4 12"/></svg>
                            Salvo
                        </span>
                    </div>
                    <div class="editor-toolbar-right">
                        <button class="toolbar-btn pin" id="btnPin" onclick="togglePin()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            Fixar
                        </button>
                        <button class="toolbar-btn del" onclick="excluirNotaAtiva()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            Excluir
                        </button>
                    </div>
                </div>

                <!-- Área de texto -->
                <div class="editor-area">
                    <input type="text" class="editor-titulo" id="editorTitulo" placeholder="Título" autocomplete="off">
                    <textarea class="editor-texto" id="editorTexto" placeholder="Comece a escrever..."></textarea>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- MODAL: CATEGORIA -->
<div class="modal-overlay" id="modalCat">
    <div class="modal-box">
        <div class="modal-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            Nova Categoria
        </div>
        <div class="form-group">
            <label>Nome</label>
            <input type="text" id="catNome" placeholder="Ex: Estratégia, Pessoal, Projetos">
        </div>
        <div class="form-group">
            <label>Cor</label>
            <div class="cores-grid" id="coresGrid"></div>
        </div>
        <div class="modal-btns">
            <button class="btn-cancelar" onclick="fecharModal('modalCat')">Cancelar</button>
            <button class="btn-salvar" onclick="salvarCat()">Criar</button>
        </div>
    </div>
</div>

<div id="notasToast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="notas.js?v=1786118031"></script>
</body>
