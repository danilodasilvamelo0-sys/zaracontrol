*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#080808}
body{font-family:'Open Sans',sans-serif;background:#080808;color:#e8e4de;min-height:100vh;padding:12px 12px 80px 12px;font-size:15px}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(212,175,125,.35) 50%,transparent 95%);z-index:9999}
.main-container{max-width:700px;margin:0 auto}
.container{background:linear-gradient(145deg,#0e0e0e,#111);border:1px solid rgba(212,175,125,.1);border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.header{background:linear-gradient(135deg,#111,#0a0a0a);border-bottom:1px solid rgba(212,175,125,.12);padding:22px;text-align:center}
.header h1{font-size:1.6em;letter-spacing:5px;color:#d4af7d;font-weight:700}
.header p{font-size:.72em;color:rgba(255,255,255,.3);letter-spacing:3px;margin-top:4px}
.main-tabs{display:flex;background:#0c0c0c;border-bottom:1px solid rgba(212,175,125,.1)}
.main-tab{flex:1;padding:14px;text-align:center;background:transparent;border:none;color:rgba(255,255,255,.3);font-size:.82em;cursor:pointer;transition:all .3s;border-bottom:2px solid transparent;font-family:'Open Sans',sans-serif;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.main-tab:hover{color:rgba(255,255,255,.5)}
.main-tab.active{color:#d4af7d;border-bottom-color:#d4af7d;background:rgba(212,175,125,.03)}
.main-tab-content{display:none}.main-tab-content.active{display:block}
.tp{padding:16px}
.box{background:linear-gradient(160deg,#0c0c0c,#0a0a0a);border:1px solid rgba(212,175,125,.08);border-radius:10px;padding:16px;margin-bottom:12px}
.box-t{font-size:.72em;color:rgba(212,175,125,.45);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-weight:600}
.btn{padding:10px 18px;border-radius:6px;font-family:'Open Sans',sans-serif;font-size:.82em;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid}
.btn:active{transform:scale(.97)}
.btn-gold{background:rgba(212,175,125,.08);border-color:rgba(212,175,125,.25);color:#d4af7d}
.btn-green{background:rgba(46,204,113,.06);border-color:rgba(46,204,113,.18);color:#2ecc71}
.btn-red{background:rgba(231,76,60,.05);border-color:rgba(231,76,60,.15);color:#e74c3c}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.06);color:rgba(255,255,255,.3)}
.btn-sm{padding:6px 12px;font-size:.72em}
.btn-full{width:100%}
.input{width:100%;padding:10px 12px;background:rgba(10,10,10,.8);border:1px solid rgba(255,255,255,.06);border-radius:5px;color:#e8e4de;font-size:.85em;font-family:'Open Sans',sans-serif}
.input:focus{border-color:rgba(212,175,125,.3);outline:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 20px;background:#141414;border:1px solid rgba(212,175,125,.2);border-radius:6px;color:#d4af7d;font-size:.8em;font-weight:600;z-index:10001;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sub-tab{padding:8px 16px;border-radius:6px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.3);font-size:.75em;font-weight:600;cursor:pointer;transition:all .3s;font-family:'Open Sans',sans-serif;letter-spacing:1px;text-transform:uppercase}
.sub-tab.active{background:rgba(212,175,125,.06);border-color:rgba(212,175,125,.2);color:#d4af7d}
.fut-section{display:none}.fut-section.active{display:block}

/* BACARA SPECIFIC */
.bac-btn{padding:16px;border-radius:8px;font-size:1em;font-weight:700;cursor:pointer;transition:all .15s;border:2px solid;font-family:‘Open Sans’,sans-serif;text-transform:uppercase;letter-spacing:1px;flex:1;text-align:center}
.bac-btn:active{transform:scale(.95)}
.bac-btn.banker{background:rgba(231,76,60,.08);border-color:rgba(231,76,60,.25);color:#e74c3c}
.bac-btn.player{background:rgba(52,152,219,.08);border-color:rgba(52,152,219,.25);color:#3498db}
.bac-btn.tie{background:rgba(46,204,113,.06);border-color:rgba(46,204,113,.2);color:#2ecc71}

/* BIG ROAD */
.bigroad{display:grid;grid-template-rows:repeat(6,1fr);grid-auto-flow:column;grid-auto-columns:28px;gap:2px;min-height:180px;overflow-x:auto;padding:8px 4px;background:rgba(0,0,0,.2);border-radius:8px;border:1px solid rgba(255,255,255,.03)}
.bigroad-cell{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55em;font-weight:700}
.bigroad-cell.B{background:rgba(231,76,60,.2);border:2px solid rgba(231,76,60,.5);color:#e74c3c}
.bigroad-cell.P{background:rgba(52,152,219,.2);border:2px solid rgba(52,152,219,.5);color:#3498db}
.bigroad-cell.T{background:rgba(46,204,113,.15);border:1px solid rgba(46,204,113,.4);color:#2ecc71}

@media(max-width:500px){
.bac-btn{padding:14px 8px;font-size:.9em}
.bigroad{grid-auto-columns:24px}
.bigroad-cell{width:22px;height:22px;font-size:.5em}
}
</style>

</head>

<script>
// ==========================================
// UTILS
// ==========================================
var SVG_EDIT='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>';
var SVG_TRASH='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
function parseBR(s){if(!s)return 0;s=String(s).replace(/\s/g,'').replace(/R\$\s*/g,'').replace(/\./g,'').replace(',','.');return parseFloat(s)||0;}
function fmtBR(v){return(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtI(el){el.value=el.value.replace(/[^0-9.,]/g,'');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function playClick(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator();var g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type='sine';g.gain.value=0.12;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.06);o.stop(a.currentTime+0.06);}catch(e){}}
function playCash(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var t=a.currentTime;[3520,5274].forEach(function(fr,i){var o=a.createOscillator();var g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=fr;o.type='sine';g.gain.setValueAtTime(0.12,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+0.2+i*0.1);o.start(t+0.03);o.stop(t+0.3+i*0.1);});}catch(e){}}

// ==========================================
// TABS
// ==========================================
function switchMain(tab){
    document.querySelectorAll('.main-tab').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.main-tab-content').forEach(function(c){c.classList.remove('active');});
    var btn=document.querySelector('.main-tab[onclick*="'+tab+'"]');if(btn)btn.classList.add('active');
    var p=document.getElementById('tab-'+tab);if(p)p.classList.add('active');
}
function switchSub(el,id){
    document.querySelectorAll('#tab-esportes .sub-tab').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.fut-section').forEach(function(s){s.classList.remove('active');});
    el.classList.add('active');document.getElementById(id).classList.add('active');
}

// ==========================================
// BACARA ENGINE
// ==========================================
var BAC_KEY='bacZara';
var BAC={hist:[],hands:0};
function loadBAC(){try{var d=localStorage.getItem(BAC_KEY);if(d)BAC=Object.assign({hist:[],hands:0},JSON.parse(d));}catch(e){}}
function saveBAC(){try{localStorage.setItem(BAC_KEY,JSON.stringify(BAC));triggerSync();}catch(e){}}

function bacAdd(r){playClick();BAC.hist.push(r);BAC.hands++;saveBAC();renderBAC();}
function bacUndo(){if(!BAC.hist.length)return;BAC.hist.pop();BAC.hands=Math.max(0,BAC.hands-1);saveBAC();renderBAC();}
function bacReset(){BAC.hist=[];BAC.hands=0;saveBAC();renderBAC();toast('Sessão resetada');}

function renderBAC(){
    var h=BAC.hist;var total=h.length;
    var bCount=h.filter(function(x){return x==='B';}).length;
    var pCount=h.filter(function(x){return x==='P';}).length;
    var tCount=h.filter(function(x){return x==='T';}).length;
    var bPct=total>0?Math.round(bCount/total*100):0;
    var pPct=total>0?Math.round(pCount/total*100):0;
    var tPct=total>0?Math.round(tCount/total*100):0;

    // BIG ROAD
    var brE=document.getElementById('bigRoad');
    if(brE){
        var cols=[];var col=[];var lastBP='';
        h.forEach(function(r){
            if(r==='T'){if(col.length)col[col.length-1].ties=(col[col.length-1].ties||0)+1;return;}
            if(r===lastBP){col.push({r:r,ties:0});}
            else{if(col.length)cols.push(col);col=[{r:r,ties:0}];lastBP=r;}
        });
        if(col.length)cols.push(col);

        var html='';
        cols.forEach(function(column){
            for(var row=0;row<6&&row<column.length;row++){
                var cell=column[row];
                var tDot=cell.ties>0?'<div style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#2ecc71;font-size:5px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;">'+cell.ties+'</div>':'';
                html+='<div class="bigroad-cell '+cell.r+'" style="grid-row:'+(row+1)+';position:relative;">'+cell.r+tDot+'</div>';
            }
        });
        if(!html)html='<div style="grid-row:1/7;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.06);font-size:.8em;min-width:200px;">Registre as mãos</div>';
        brE.innerHTML=html;
        brE.scrollLeft=brE.scrollWidth;
    }

    // HISTORY
    var hE=document.getElementById('bacHist');
    if(hE){
        hE.innerHTML=h.slice(-40).map(function(r){
            var bg=r==='B'?'rgba(231,76,60,.12)':r==='P'?'rgba(52,152,219,.12)':'rgba(46,204,113,.1)';
            var bo=r==='B'?'rgba(231,76,60,.25)':r==='P'?'rgba(52,152,219,.25)':'rgba(46,204,113,.2)';
            var co=r==='B'?'#e74c3c':r==='P'?'#3498db':'#2ecc71';
            return '<span style="padding:3px 8px;background:'+bg+';border:1px solid '+bo+';border-radius:4px;font-size:.72em;font-weight:700;color:'+co+';">'+r+'</span>';
        }).join('');
    }

    // STATS
    var sE=document.getElementById('bacStats');
    if(sE){
        sE.innerHTML='<div class="grid-3" style="text-align:center;margin-bottom:10px;">'+
            '<div style="padding:10px;background:rgba(231,76,60,.04);border:1px solid rgba(231,76,60,.08);border-radius:6px;"><div style="font-size:.55em;color:rgba(231,76,60,.5);text-transform:uppercase;letter-spacing:1px;">Banker</div><div style="font-size:1.3em;font-weight:700;color:#e74c3c;">'+bCount+'</div><div style="font-size:.65em;color:rgba(231,76,60,.4);">'+bPct+'%</div></div>'+
            '<div style="padding:10px;background:rgba(52,152,219,.04);border:1px solid rgba(52,152,219,.08);border-radius:6px;"><div style="font-size:.55em;color:rgba(52,152,219,.5);text-transform:uppercase;letter-spacing:1px;">Player</div><div style="font-size:1.3em;font-weight:700;color:#3498db;">'+pCount+'</div><div style="font-size:.65em;color:rgba(52,152,219,.4);">'+pPct+'%</div></div>'+
            '<div style="padding:10px;background:rgba(46,204,113,.03);border:1px solid rgba(46,204,113,.06);border-radius:6px;"><div style="font-size:.55em;color:rgba(46,204,113,.4);text-transform:uppercase;letter-spacing:1px;">Tie</div><div style="font-size:1.3em;font-weight:700;color:#2ecc71;">'+tCount+'</div><div style="font-size:.65em;color:rgba(46,204,113,.35);">'+tPct+'%</div></div>'+
        '</div>'+
        '<div style="text-align:center;font-size:.78em;color:rgba(255,255,255,.25);">Total: '+total+' mãos'+(total>0?' — Esperado: B 45.8% | P 44.6% | T 9.5%':'')+'</div>';
    }

    // STREAKS
    var skE=document.getElementById('bacStreaks');
    if(skE){
        var curStreak=0,curType='',maxB=0,maxP=0,maxCur=0,streakType='';
        h.forEach(function(r){
            if(r==='T')return;
            if(r===curType){curStreak++;}else{curType=r;curStreak=1;}
            if(curType==='B'&&curStreak>maxB)maxB=curStreak;
            if(curType==='P'&&curStreak>maxP)maxP=curStreak;
        });
        if(curType){streakType=curType;maxCur=curStreak;}

        var streakCol=streakType==='B'?'#e74c3c':streakType==='P'?'#3498db':'rgba(255,255,255,.3)';
        var streakName=streakType==='B'?'Banker':streakType==='P'?'Player':'—';

        skE.innerHTML='<div class="grid-3" style="text-align:center;">'+
            '<div style="padding:10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03);border-radius:6px;"><div style="font-size:.55em;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1px;">Streak Atual</div><div style="font-size:1.5em;font-weight:700;color:'+streakCol+';">'+maxCur+'</div><div style="font-size:.65em;color:'+streakCol+';">'+streakName+'</div></div>'+
            '<div style="padding:10px;background:rgba(231,76,60,.03);border:1px solid rgba(231,76,60,.05);border-radius:6px;"><div style="font-size:.55em;color:rgba(231,76,60,.4);text-transform:uppercase;letter-spacing:1px;">Maior B</div><div style="font-size:1.5em;font-weight:700;color:#e74c3c;">'+maxB+'</div></div>'+
            '<div style="padding:10px;background:rgba(52,152,219,.03);border:1px solid rgba(52,152,219,.05);border-radius:6px;"><div style="font-size:.55em;color:rgba(52,152,219,.4);text-transform:uppercase;letter-spacing:1px;">Maior P</div><div style="font-size:1.5em;font-weight:700;color:#3498db;">'+maxP+'</div></div>'+
        '</div>';
    }
}

var CG_KEY='cgZara';
var CG={dep:0,atual:0,saques:[],movs:[]};
function loadCG(){try{var d=localStorage.getItem(CG_KEY);if(d)CG=Object.assign({dep:0,atual:0,saques:[],movs:[]},JSON.parse(d));}catch(e){}}
function _saveCG(){try{localStorage.setItem(CG_KEY,JSON.stringify(CG));triggerSync();}catch(e){}}
function salvarCG(){CG.dep=parseBR(document.getElementById('cgDep').value);CG.atual=parseBR(document.getElementById('cgAtual').value);_saveCG();renderCG();}
function regSaque(){var val=parseBR(document.getElementById('cgSaqVal').value);if(!val||val<=0)return;if(val>CG.atual){toast('Saldo insuficiente');return;}var dest=document.getElementById('cgSaqDest').value||'';CG.atual-=val;CG.saques.push({valor:val,data:new Date().toISOString(),destino:dest});CG.movs.push({tipo:'saque',valor:val,data:new Date().toISOString()});document.getElementById('cgAtual').value=fmtBR(CG.atual);document.getElementById('cgSaqVal').value='';document.getElementById('cgSaqDest').selectedIndex=0;_saveCG();renderCG();playCash();toast('Saque R$ '+fmtBR(val)+(dest?' — '+dest:''));}
function regPerda(){var val=parseBR(document.getElementById('cgPerdaVal').value);if(!val||val<=0)return;CG.movs.push({tipo:'perda',valor:val,data:new Date().toISOString()});document.getElementById('cgPerdaVal').value='';_saveCG();renderCG();toast('Perda R$ '+fmtBR(val));}
function delSaque(i){CG.saques.splice(i,1);_saveCG();renderCG();}
function delMovCG(i){CG.movs.splice(i,1);_saveCG();renderCG();}
function editSaque(i){var s=CG.saques[i];if(!s)return;var nv=prompt('Valor:',fmtBR(s.valor));if(nv===null)return;var dt=new Date(s.data);var nd=prompt('Data (dd/mm/aaaa):',dt.toLocaleDateString('pt-BR'));if(nd===null)return;var nD=prompt('Destino:',s.destino||'');if(nD===null)return;var pv=parseBR(nv);if(pv>0)s.valor=pv;var pd=nd.split('/');if(pd.length===3){var dd=new Date(pd[2],pd[1]-1,pd[0]);if(!isNaN(dd.getTime()))s.data=dd.toISOString();}s.destino=nD;_saveCG();renderCG();toast('Editado');}
function editMovCG(i){var m=CG.movs[i];if(!m)return;var nv=prompt('Valor:',fmtBR(m.valor));if(nv===null)return;var dt=new Date(m.data);var nd=prompt('Data (dd/mm/aaaa):',dt.toLocaleDateString('pt-BR'));if(nd===null)return;var pv=parseBR(nv);if(pv>0)m.valor=pv;var pd=nd.split('/');if(pd.length===3){var dd=new Date(pd[2],pd[1]-1,pd[0]);if(!isNaN(dd.getTime()))m.data=dd.toISOString();}_saveCG();renderCG();toast('Editado');}

function renderCG(){
    var dE=document.getElementById('cgDep'),aE=document.getElementById('cgAtual');
    if(dE&&document.activeElement!==dE)dE.value=CG.dep?fmtBR(CG.dep):'';
    if(aE&&document.activeElement!==aE)aE.value=CG.atual?fmtBR(CG.atual):'';
    var lucro=CG.atual-CG.dep,lE=document.getElementById('cgLucro'),lB=document.getElementById('cgLucroBox');
    if(lE){if(CG.dep>0||CG.atual>0){lE.textContent=(lucro>=0?'+':'')+' R$ '+fmtBR(Math.abs(lucro));lE.style.color=lucro>=0?'#2ecc71':'#e74c3c';if(lB){lB.style.background=lucro>=0?'rgba(46,204,113,.04)':'rgba(231,76,60,.04)';lB.style.border='1px solid '+(lucro>=0?'rgba(46,204,113,.1)':'rgba(231,76,60,.1)');}}else{lE.textContent='—';lE.style.color='rgba(255,255,255,.25)';}}
    var ts=CG.saques.reduce(function(s,x){return s+x.valor;},0);
    var tE=document.getElementById('cgTotal');
    if(tE){if(ts>0){tE.style.display='block';tE.innerHTML='<div style="font-size:.58em;color:rgba(46,204,113,.4);text-transform:uppercase;letter-spacing:1.5px;">Total Sacado</div><div style="font-size:1.3em;font-weight:700;color:#2ecc71;margin-top:4px;">R$ '+fmtBR(ts)+'</div>';}else tE.style.display='none';}
    var eE=document.getElementById('cgExtrato');if(eE){
        var now=new Date(),mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
        var sm=CG.saques.filter(function(s){return s.data.startsWith(mk);});
        var pm=CG.movs.filter(function(m){return(m.tipo==='perda'||m.tipo==='quebra')&&m.data.startsWith(mk);});

        var html='';
        if(sm.length||pm.length){var sc=sal>=0?'#2ecc71':'#e74c3c';html+='<div style="display:flex;justify-content:space-between;padding:8px 0;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.78em;"><span style="color:rgba(46,204,113,.5);">Saques: R$ '+fmtBR(tsm)+'</span><span style="color:rgba(231,76,60,.5);">Perdas: R$ '+fmtBR(tpm)+'</span><span style="color:'+sc+';font-weight:600;">Saldo: '+(sal>=0?'+':'')+fmtBR(sal)+'</span></div>';}
        sm.forEach(function(s){var dt=new Date(s.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});var gi=CG.saques.indexOf(s);var tag=s.destino?'<span style="padding:1px 6px;background:rgba(212,175,125,.05);border:1px solid rgba(212,175,125,.08);border-radius:8px;font-size:.65em;color:rgba(212,175,125,.45);margin-left:6px;">'+s.destino+'</span>':'';html+='<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.02);"><div style="width:5px;height:5px;border-radius:50%;background:#2ecc71;margin-right:8px;flex-shrink:0;"></div><div style="flex:1;"><div><span style="font-size:.82em;font-weight:600;color:#2ecc71;">+R$ '+fmtBR(s.valor)+'</span>'+tag+'</div><div style="font-size:.68em;color:rgba(255,255,255,.25);margin-top:1px;">'+dt+'</div></div><div style="display:flex;gap:4px;"><button onclick="editSaque('+gi+')" style="background:transparent;border:none;color:rgba(212,175,125,.2);cursor:pointer;display:flex;padding:3px;">'+SVG_EDIT+'</button><button onclick="delSaque('+gi+')" style="background:transparent;border:none;color:rgba(231,76,60,.15);cursor:pointer;display:flex;padding:3px;">'+SVG_TRASH+'</button></div></div>';});
        pm.forEach(function(m){var dt=new Date(m.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});var gi=CG.movs.indexOf(m);html+='<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.02);"><div style="width:5px;height:5px;border-radius:50%;background:#e74c3c;margin-right:8px;flex-shrink:0;"></div><div style="flex:1;"><span style="font-size:.82em;font-weight:600;color:#e74c3c;">-R$ '+fmtBR(m.valor)+'</span><div style="font-size:.68em;color:rgba(255,255,255,.25);margin-top:1px;">'+dt+'</div></div><div style="display:flex;gap:4px;"><button onclick="editMovCG('+gi+')" style="background:transparent;border:none;color:rgba(212,175,125,.2);cursor:pointer;display:flex;padding:3px;">'+SVG_EDIT+'</button><button onclick="delMovCG('+gi+')" style="background:transparent;border:none;color:rgba(231,76,60,.15);cursor:pointer;display:flex;padding:3px;">'+SVG_TRASH+'</button></div></div>';});
        if(!html)html='<div style="text-align:center;color:rgba(255,255,255,.08);padding:12px;font-size:.8em;">Nenhuma movimentação.</div>';eE.innerHTML=html;}
    var bE=document.getElementById('cgBalanco');if(bE){
        var meses={};CG.saques.forEach(function(s){var k=s.data.substring(0,7);meses[k]=(meses[k]||0)+s.valor;});CG.movs.filter(function(m){return m.tipo==='perda'||m.tipo==='quebra';}).forEach(function(m){var k=m.data.substring(0,7);meses[k]=(meses[k]||0)-m.valor;});
        var ks=Object.keys(meses).sort().reverse();if(!ks.length){bE.innerHTML='';return;}
        var ms=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        bE.innerHTML=ks.slice(0,6).map(function(k){var p=k.split('-');var v=meses[k];return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.015);font-size:.75em;"><span style="color:rgba(255,255,255,.35);">'+ms[parseInt(p[1])]+' '+p[0]+'</span><span style="font-weight:600;color:'+(v>=0?'#2ecc71':'#e74c3c')+';">'+(v>=0?'+':'')+' R$ '+fmtBR(Math.abs(v))+'</span></div>';}).join('');}
}

var FUT_KEY='futZara';var F={bets:[],movs:[],banca:0};
function loadFut(){try{var s=localStorage.getItem(FUT_KEY);if(s)F=Object.assign({bets:[],movs:[],banca:0},JSON.parse(s));}catch(e){}}
function saveFut(){try{localStorage.setItem(FUT_KEY,JSON.stringify(F));triggerSync();}catch(e){}}
function regBet(){var jogo=document.getElementById('betJogo').value.trim();if(!jogo)return;var odd=parseFloat(document.getElementById('betOdd').value)||0;var stake=parseFloat(document.getElementById('betStake').value)||0;if(!odd||!stake)return;F.bets.push({id:Date.now().toString(36),jogo:jogo,odd:odd,stake:stake,status:'pending',data:new Date().toISOString()});F.banca-=stake;document.getElementById('betJogo').value='';document.getElementById('betOdd').value='';document.getElementById('betStake').value='';saveFut();renderSP();toast('Aposta registrada');}
function resolveBet(id,st){var b=F.bets.find(function(x){return x.id===id;});if(!b||b.status!=='pending')return;b.status=st;if(st==='won')F.banca+=b.stake*b.odd;else if(st==='void')F.banca+=b.stake;saveFut();renderSP();}
function deleteBet(id){var b=F.bets.find(function(x){return x.id===id;});if(!b)return;if(b.status==='pending')F.banca+=b.stake;else if(b.status==='won')F.banca-=b.stake*b.odd;else if(b.status==='void')F.banca-=b.stake;F.bets=F.bets.filter(function(x){return x.id!==id;});saveFut();renderSP();}
function delSpMov(id){var m=F.movs.find(function(x){return x.id===id;});if(!m)return;if(m.tipo==='deposito')F.banca-=m.valor;else F.banca+=m.valor;F.movs=F.movs.filter(function(x){return x.id!==id;});saveFut();renderSP();}
function spMov(tipo){var elId=tipo==='deposito'?'spDepVal':'spSaqVal';var val=parseBR(document.getElementById(elId).value);if(!val||val<=0)return;if(tipo==='deposito')F.banca+=val;else{if(val>F.banca){toast('Insuficiente');return;}F.banca-=val;}F.movs.push({id:Date.now().toString(36),tipo:tipo,valor:val,data:new Date().toISOString()});document.getElementById(elId).value='';saveFut();renderSP();toast((tipo==='deposito'?'Dep':'Saq')+' R$ '+fmtBR(val));}

function renderSP(){
    document.getElementById('spBanca').textContent='R$ '+fmtBR(F.banca);
    var pend=F.bets.filter(function(b){return b.status==='pending';});
    document.getElementById('pendCount').textContent=pend.length?pend.length+'':'';
    var pE=document.getElementById('pendList');
    if(pE){if(!pend.length)pE.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.06);padding:10px;font-size:.8em;">—</div>';
    else pE.innerHTML=pend.map(function(b){return '<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.02);"><div style="display:flex;justify-content:space-between;"><span style="font-size:.85em;font-weight:600;">'+b.jogo+'</span><span style="font-size:.82em;color:#d4af7d;font-weight:600;">'+b.odd+'x</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;"><span style="font-size:.72em;color:rgba(255,255,255,.3);">R$ '+fmtBR(b.stake)+'</span><div style="display:flex;gap:4px;"><button class="btn btn-green btn-sm" onclick="resolveBet(&quot;'+b.id+'&quot;,&quot;won&quot;)">Green</button><button class="btn btn-red btn-sm" onclick="resolveBet(&quot;'+b.id+'&quot;,&quot;lost&quot;)">Red</button><button class="btn btn-ghost btn-sm" onclick="resolveBet(&quot;'+b.id+'&quot;,&quot;void&quot;)">Void</button><button onclick="deleteBet(&quot;'+b.id+'&quot;)" style="background:transparent;border:none;color:rgba(231,76,60,.2);cursor:pointer;display:flex;padding:3px;">'+SVG_TRASH+'</button></div></div></div>';}).join('');}
    var today=new Date().toISOString().substring(0,10);var res=F.bets.filter(function(b){return b.status!=='pending'&&b.data.startsWith(today);});
    var rE=document.getElementById('resolvList');
    if(rE){if(!res.length)rE.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.06);padding:10px;font-size:.8em;">—</div>';
    else rE.innerHTML=res.map(function(b){var co=b.status==='won'?'#2ecc71':b.status==='lost'?'#e74c3c':'rgba(255,255,255,.4)';var g=b.status==='won'?(b.stake*b.odd-b.stake):b.status==='lost'?-b.stake:0;return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.02);font-size:.8em;"><span>'+b.jogo+'</span><span style="font-weight:600;color:'+co+';">'+(g>=0?'+':'')+' R$ '+fmtBR(Math.abs(g))+'</span></div>';}).join('');}
    var mE=document.getElementById('spMovList');
    if(mE)mE.innerHTML=F.movs.slice(-8).reverse().map(function(m){var dt=new Date(m.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.015);font-size:.75em;"><span style="color:rgba(255,255,255,.3);">'+dt+'</span><span style="font-weight:600;color:'+(m.tipo==='deposito'?'#2ecc71':'#e74c3c')+';">'+(m.tipo==='deposito'?'+':'-')+' R$ '+fmtBR(m.valor)+'</span><button onclick="delSpMov(&quot;'+m.id+'&quot;)" style="background:transparent;border:none;color:rgba(231,76,60,.12);cursor:pointer;display:flex;padding:2px;">'+SVG_TRASH+'</button></div>';}).join('');
    var mnE=document.getElementById('spMensal');
    if(mnE){var won=F.bets.filter(function(b){return b.status==='won';});var lost=F.bets.filter(function(b){return b.status==='lost';});var tW=won.reduce(function(s,b){return s+(b.stake*b.odd-b.stake);},0);var tL=lost.reduce(function(s,b){return s+b.stake;},0);var luc=tW-tL;var wr=(won.length+lost.length)>0?Math.round(won.length/(won.length+lost.length)*100):0;
        mnE.innerHTML='<div class="grid-3" style="text-align:center;"><div><div style="font-size:.55em;color:#2ecc71;">Greens</div><div style="font-weight:600;color:#2ecc71;">'+won.length+'</div></div><div><div style="font-size:.55em;color:#e74c3c;">Reds</div><div style="font-weight:600;color:#e74c3c;">'+lost.length+'</div></div><div><div style="font-size:.55em;color:rgba(255,255,255,.3);">WR</div><div style="font-weight:600;color:'+(wr>=50?'#2ecc71':'#e74c3c')+';">'+wr+'%</div></div></div><div style="text-align:center;margin-top:8px;font-weight:600;color:'+(luc>=0?'#2ecc71':'#e74c3c')+';">'+(luc>=0?'+':'')+' R$ '+fmtBR(Math.abs(luc))+'</div>';}
    var abE=document.getElementById('spAllBets');
    if(abE){var all=F.bets.slice().reverse().slice(0,20);if(!all.length)abE.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.06);padding:10px;font-size:.8em;">—</div>';
    else abE.innerHTML=all.map(function(b){var co=b.status==='won'?'#2ecc71':b.status==='lost'?'#e74c3c':b.status==='pending'?'#d4af7d':'rgba(255,255,255,.4)';var dt=new Date(b.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.015);font-size:.75em;"><span style="color:rgba(255,255,255,.45);">'+b.jogo+' <span style="color:rgba(255,255,255,.15);">'+dt+'</span></span><div style="display:flex;gap:6px;align-items:center;"><span style="color:'+co+';font-weight:600;">'+b.odd+'x</span><button onclick="deleteBet(&quot;'+b.id+'&quot;)" style="background:transparent;border:none;color:rgba(231,76,60,.12);cursor:pointer;display:flex;padding:2px;">'+SVG_TRASH+'</button></div></div>';}).join('');}
}
