/* ========== ZARA PREMIUM DESIGN SYSTEM v2.0 ========== */
:root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --surface3: #222222;
    --gold: #d4af7d;
    --cyan: #00d4ff;
    --magenta: #ff006e;
    --green: #00ff87;
    --orange: #ff8c00;
    --purple: #a855f7;
    --blue: #3b82f6;
    --red: #ef4444;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    --text-muted: rgba(255, 255, 255, 0.4);
}

/* Sidebar Premium */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 60px;
    height: 100vh;
    background: linear-gradient(180deg, #0c0c0c 0%, #151515 100%);
    border-right: 1px solid rgba(0, 212, 255, 0.1);
    z-index: 1000;
    box-shadow: 4px 0 25px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px 0;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
}

.sidebar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--gold), var(--green));
    background-size: 300% 100%;
    animation: sidebarGradient 4s ease infinite;
}

@keyframes sidebarGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.sidebar:hover { width: 210px; }

.sidebar-logo {
    width: 42px;
    height: 42px;
    background: var(--surface);
    border: 2px solid transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.3em;
    font-weight: 600;
    margin-bottom: 22px;
    flex-shrink: 0;
    text-decoration: none;
    position: relative;
    color: var(--gold);
}

.sidebar-logo::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--magenta));
    z-index: -1;
}

.sidebar-menu {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    flex: 1;
}

.sidebar-menu a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 12px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85em;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 3px solid transparent;
    white-space: nowrap;
    position: relative;
}

.sidebar-menu a::after {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0;
    transition: width 0.3s ease;
    z-index: -1;
}

.sidebar-menu a:hover::after { width: 100%; }
.sidebar-menu a:hover { color: var(--text); }

.sidebar-menu a svg {
    width: 22px;
    height: 22px;
    min-width: 22px;
    margin-left: 8px;
    transition: all 0.3s ease;
}

/* Ícones coloridos por seção */
.sidebar-menu a[href*="comando"] svg { stroke: var(--cyan); }
.sidebar-menu a[href*="comando"]:hover,
.sidebar-menu a[href*="comando"].active { border-left-color: var(--cyan); color: var(--cyan); background: rgba(0, 212, 255, 0.08); }
.sidebar-menu a[href*="comando"]::after { background: linear-gradient(90deg, rgba(0, 212, 255, 0.1), transparent); }

.sidebar-menu a[href*="index"] svg { stroke: var(--magenta); }
.sidebar-menu a[href*="index"]:hover,
.sidebar-menu a[href*="index"].active { border-left-color: var(--magenta); color: var(--magenta); background: rgba(255, 0, 110, 0.08); }
.sidebar-menu a[href*="index"]::after { background: linear-gradient(90deg, rgba(255, 0, 110, 0.1), transparent); }

.sidebar-menu a[href*="saude"] svg { stroke: var(--green); }
.sidebar-menu a[href*="saude"]:hover,
.sidebar-menu a[href*="saude"].active { border-left-color: var(--green); color: var(--green); background: rgba(0, 255, 135, 0.08); }
.sidebar-menu a[href*="saude"]::after { background: linear-gradient(90deg, rgba(0, 255, 135, 0.1), transparent); }

.sidebar-menu a[href*="financeiro"] svg { stroke: var(--gold); }
.sidebar-menu a[href*="financeiro"]:hover,
.sidebar-menu a[href*="financeiro"].active { border-left-color: var(--gold); color: var(--gold); background: rgba(212, 175, 125, 0.08); }
.sidebar-menu a[href*="financeiro"]::after { background: linear-gradient(90deg, rgba(212, 175, 125, 0.1), transparent); }

.sidebar-menu a[href*="profissional"] svg { stroke: var(--orange); }
.sidebar-menu a[href*="profissional"]:hover,
.sidebar-menu a[href*="profissional"].active { border-left-color: var(--orange); color: var(--orange); background: rgba(255, 140, 0, 0.08); }
.sidebar-menu a[href*="profissional"]::after { background: linear-gradient(90deg, rgba(255, 140, 0, 0.1), transparent); }

.sidebar-menu a[href*="agenda"] svg { stroke: var(--purple); }
.sidebar-menu a[href*="agenda"]:hover,
.sidebar-menu a[href*="agenda"].active { border-left-color: var(--purple); color: var(--purple); background: rgba(168, 85, 247, 0.08); }
.sidebar-menu a[href*="agenda"]::after { background: linear-gradient(90deg, rgba(168, 85, 247, 0.1), transparent); }

.sidebar-menu a span {
    opacity: 0;
    transition: opacity 0.3s ease;
    font-weight: 500;
}

.sidebar:hover .sidebar-menu a span { opacity: 1; }

.sidebar-footer {
    padding: 16px 12px;
    text-align: center;
    border-top: 1px solid rgba(0, 212, 255, 0.1);
    width: 100%;
    background: rgba(0, 0, 0, 0.4);
}

.sidebar-footer p {
    color: var(--text-dim);
    font-size: 0.7em;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    line-height: 1.6;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.sidebar-footer .instituto {
    font-size: 0.9em;
    font-weight: 600;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block;
    margin-bottom: 4px;
}

.sidebar:hover .sidebar-footer p { opacity: 1; }

/* Mobile Navigation */
.mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, #1a1a1a 0%, #0c0c0c 100%);
    border-top: 2px solid;
    border-image: linear-gradient(90deg, var(--cyan), var(--magenta), var(--gold), var(--green)) 1;
    padding: 10px 0 8px;
    z-index: 1000;
}

.mobile-nav-items {
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.62em;
    font-weight: 600;
    padding: 6px 12px;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
}

.mobile-nav-item svg {
    width: 24px;
    height: 24px;
    transition: all 0.3s ease;
}

.mobile-nav-item[href*="comando"] svg { stroke: var(--cyan); }
.mobile-nav-item[href*="comando"].active { color: var(--cyan); }

.mobile-nav-item[href*="index"] svg { stroke: var(--magenta); }
.mobile-nav-item[href*="index"].active { color: var(--magenta); }

.mobile-nav-item[href*="saude"] svg { stroke: var(--green); }
.mobile-nav-item[href*="saude"].active { color: var(--green); }

.mobile-nav-item[href*="financeiro"] svg { stroke: var(--gold); }
.mobile-nav-item[href*="financeiro"].active { color: var(--gold); }

.mobile-nav-item[href*="profissional"] svg { stroke: var(--orange); }
.mobile-nav-item[href*="profissional"].active { color: var(--orange); }

.mobile-nav-item[href*="agenda"] svg { stroke: var(--purple); }
.mobile-nav-item[href*="agenda"].active { color: var(--purple); }

/* Body accent lines */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--gold), var(--green));
    background-size: 300% 100%;
    animation: bodyGradient 4s ease infinite;
    z-index: 9999;
}

@keyframes bodyGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body::after {
    content: '';
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    z-index: 9999;
}

/* Responsive */
@media (max-width: 768px) {
    body {
        padding: 12px !important;
        padding-bottom: 85px !important;
        padding-left: 12px !important;
    }
    .sidebar { display: none !important; }
    .mobile-nav { display: block !important; }
    .container { margin-left: 0 !important; }
}

@media (min-width: 769px) {
    body { padding-left: 80px; }
    .mobile-nav { display: none !important; }
}
/* ========== END PREMIUM DESIGN SYSTEM ========== */

            <div class="grid-2" style="margin-bottom:10px;">
                <div style="display:flex;gap:4px;"><input type="text" id="spDepVal" placeholder="Depósito R$" inputmode="decimal" oninput="fmtI(this)" class="input" style="flex:1;"><button class="btn btn-green btn-sm" onclick="spMov('deposito')">+</button></div>
                <div style="display:flex;gap:4px;"><input type="text" id="spSaqVal" placeholder="Saque R$" inputmode="decimal" oninput="fmtI(this)" class="input" style="flex:1;"><button class="btn btn-red btn-sm" onclick="spMov('saque')">-</button></div>
            </div>
            <div id="spMovList"></div>
        </div>
        <div class="box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <div class="box-t" style="margin:0;">Mensal</div>
                <div style="display:flex;align-items:center;gap:6px;">
                    <button class="btn btn-ghost btn-sm" onclick="mudarMes(-1)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
                    <span id="mesLabel" style="font-size:.78em;color:#d4af7d;min-width:80px;text-align:center;font-weight:600;"></span>
                    <button class="btn btn-ghost btn-sm" onclick="mudarMes(1)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
                </div>
            </div>
            <div id="spMensal"></div>
            <div style="margin-top:10px;">
                <button class="btn btn-ghost btn-sm btn-full" onclick="toggleSemanas()" id="btnSemanas">Ver por Semanas</button>
                <div id="spSemanas" style="display:none;margin-top:10px;"></div>
            </div>
        </div>
        <div class="box">
            <div class="box-t">Todas as Apostas</div>
            <div id="spAllBets"></div>
        </div>
    </div>
</div>


</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ==========================================
// SUPABASE — IGUAL FINANCEIRO
// ==========================================
var SUPABASE_URL='https://ltwamldgdwqzyssoukzl.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0d2FtbGRnZHdxenlzc291a3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4NzEzMDUsImV4cCI6MjA4MjQ0NzMwNX0.UVyo0c0BHslB7mCU74Qx8rdo42HA0WPAyDQ6J-FIakE';
var SYNC_ID='default';
var supabaseClient=null;var useSupabase=false;
try{supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);useSupabase=true;}catch(e){console.log('Supabase indisponivel');}

var FUT_KEY='futZara';

async function salvarSupabase(){
    if(!useSupabase)return;
    try{
        var r=await supabaseClient.from('profissional_dados').upsert({
            id:SYNC_ID,
            dados:{futebol:JSON.parse(localStorage.getItem(FUT_KEY)||'{}')},
            updated_at:new Date().toISOString()
        });
        if(r.error){console.error('Sync erro:',r.error);mostrarStatus('Erro ao sincronizar','error');}
        else{mostrarStatus('Sincronizado','success');}
    }catch(e){console.error('Sync exception:',e);}
}

async function carregarSupabase(){
    if(!useSupabase)return false;
    try{
        var r=await supabaseClient.from('profissional_dados').select('*').eq('id',SYNC_ID).maybeSingle();
        if(r.error){console.error('Load erro:',r.error);mostrarStatus('Erro ao carregar','error');return false;}
        if(r.data&&r.data.dados){
            var d=r.data.dados;
            if(d.futebol){localStorage.setItem(FUT_KEY,JSON.stringify(d.futebol));}
            mostrarStatus('Dados carregados','success');
            return true;
        }
        return false;
    }catch(e){console.error('Load exception:',e);return false;}
}

function mostrarStatus(msg,tipo){
    var el=document.getElementById('syncStatus');
    if(!el){el=document.createElement('div');el.id='syncStatus';document.body.appendChild(el);}
    el.textContent=msg;
    el.style.background=tipo==='success'?'rgba(39,174,96,.95)':'rgba(231,76,60,.95)';
    el.style.opacity='1';
    setTimeout(function(){el.style.opacity='0';},3000);
}

function salvarDados(){
    localStorage.setItem(FUT_KEY,JSON.stringify(F));
    salvarSupabase();
}

// ==========================================
// UTILS
// ==========================================
var SVG_TRASH='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
function parseBR(s){if(!s)return 0;return parseFloat(String(s).replace(/\s/g,'').replace(/R\$\s*/g,'').replace(/\./g,'').replace(',','.'))||0;}
function fmtBR(v){return(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtI(el){el.value=el.value.replace(/[^0-9.,]/g,'');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

function switchTab(el,id){
    document.querySelectorAll('.sub-tab').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
    el.classList.add('active');document.getElementById(id).classList.add('active');
}

// ==========================================
// ESPORTES
// ==========================================
var F={bets:[],movs:[],banca:0};
var mesAtual={m:new Date().getMonth()+1,y:new Date().getFullYear()};
function loadF(){try{var s=localStorage.getItem(FUT_KEY);if(s)F=Object.assign({bets:[],movs:[],banca:0},JSON.parse(s));}catch(e){}}

function mudarMes(dir){
    mesAtual.m+=dir;
    if(mesAtual.m>12){mesAtual.m=1;mesAtual.y++;}
    if(mesAtual.m<1){mesAtual.m=12;mesAtual.y--;}
    render();
}
function toggleSemanas(){
    var el=document.getElementById('spSemanas');
    var btn=document.getElementById('btnSemanas');
    if(el.style.display==='none'){el.style.display='block';btn.textContent='Ocultar Semanas';}
    else{el.style.display='none';btn.textContent='Ver por Semanas';}
}
function renderSemanas(mk,mesBets){
    var el=document.getElementById('spSemanas');if(!el)return;
    if(!mesBets.length){el.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.1);padding:10px;font-size:.8em;">Sem dados</div>';return;}
    var semanas={};
    mesBets.forEach(function(b){
        var d=new Date(b.data);var dia=d.getDate();
        var sem=Math.ceil(dia/7);
        if(!semanas[sem])semanas[sem]={won:0,lost:0,lucro:0,total:0};
        semanas[sem].total++;
        if(b.status==='won'){semanas[sem].won++;semanas[sem].lucro+=b.stake*(b.odd-1);}
        else if(b.status==='lost'){semanas[sem].lost++;semanas[sem].lucro-=b.stake;}
    });
    var ks=Object.keys(semanas).sort(function(a,b){return a-b;});
    el.innerHTML=ks.map(function(k){
        var s=semanas[k];var co=s.lucro>=0?'#2ecc71':'#e74c3c';
        var wr=s.total>0?Math.round(s.won/s.total*100):0;
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03);border-radius:6px;margin-bottom:6px;">'+
            '<div><div style="font-size:.85em;font-weight:600;color:#fff;">Semana '+k+'</div><div style="font-size:.68em;color:rgba(255,255,255,.3);margin-top:2px;">'+s.won+'G '+s.lost+'R — WR '+wr+'%</div></div>'+
            '<div style="text-align:right;"><div style="font-size:.95em;font-weight:700;color:'+co+';">'+(s.lucro>=0?'+':'')+' R$ '+fmtBR(Math.abs(s.lucro))+'</div></div>'+
        '</div>';
    }).join('');
}

function regBet(){
    var jogo=document.getElementById('betJogo').value.trim();if(!jogo)return;
    var odd=parseFloat(document.getElementById('betOdd').value)||0;
    var stake=parseFloat(document.getElementById('betStake').value)||0;
    if(!odd||!stake)return;
    F.bets.push({id:Date.now().toString(36),jogo:jogo,odd:odd,stake:stake,status:'pending',data:new Date().toISOString()});
    document.getElementById('betJogo').value='';document.getElementById('betOdd').value='';document.getElementById('betStake').value='';
    salvarDados();render();toast('Aposta registrada');
}
function resolveBet(id,st){
    var b=F.bets.find(function(x){return x.id===id;});if(!b||b.status!=='pending')return;
    b.status=st;
    salvarDados();render();
}
function deleteBet(id){
    F.bets=F.bets.filter(function(x){return x.id!==id;});salvarDados();render();
}
function delMov(id){
    F.movs=F.movs.filter(function(x){return x.id!==id;});salvarDados();render();
}
function spMov(tipo){
    var elId=tipo==='deposito'?'spDepVal':'spSaqVal';
    var val=parseBR(document.getElementById(elId).value);if(!val||val<=0)return;
    F.movs.push({id:Date.now().toString(36),tipo:tipo,valor:val,data:new Date().toISOString()});
    document.getElementById(elId).value='';salvarDados();render();toast((tipo==='deposito'?'Depósito':'Saque')+' R$ '+fmtBR(val));
}

function render(){
    // Recalcular banca dos movimentos (nunca usa F.banca acumulado)
    var bancaCalc=0;
    F.movs.forEach(function(m){if(m.tipo==='deposito')bancaCalc+=m.valor;else bancaCalc-=m.valor;});
    F.bets.forEach(function(b){if(b.status==='won')bancaCalc+=b.stake*(b.odd-1);else if(b.status==='lost')bancaCalc-=b.stake;});
    F.banca=bancaCalc;
    document.getElementById('spBanca').textContent='R$ '+fmtBR(F.banca);
    var pend=F.bets.filter(function(b){return b.status==='pending';});
    document.getElementById('pendCount').textContent=pend.length?pend.length+' aposta'+(pend.length>1?'s':''):'';
    var pE=document.getElementById('pendList');
    if(pE){
        if(!pend.length){pE.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.12);padding:14px;font-size:.85em;">Nenhuma pendente</div>';}
        else{pE.innerHTML=pend.map(function(b){
            return '<div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);">'+
                '<div style="display:flex;justify-content:space-between;align-items:center;">'+
                    '<span style="font-size:.9em;font-weight:600;color:#fff;">'+b.jogo+'</span>'+
                    '<span style="font-size:.88em;color:#d4af7d;font-weight:700;">'+b.odd+'x</span>'+
                '</div>'+
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">'+
                    '<span style="font-size:.78em;color:rgba(255,255,255,.45);">Stake: R$ '+fmtBR(b.stake)+'</span>'+
                    '<div style="display:flex;gap:4px;">'+
                        '<button class="btn btn-green btn-sm" onclick="resolveBet(&quot;'+b.id+'&quot;,&quot;won&quot;)">Green</button>'+
                        '<button class="btn btn-red btn-sm" onclick="resolveBet(&quot;'+b.id+'&quot;,&quot;lost&quot;)">Red</button>'+
                        '<button class="btn btn-ghost btn-sm" onclick="resolveBet(&quot;'+b.id+'&quot;,&quot;void&quot;)">Void</button>'+
                        '<button onclick="deleteBet(&quot;'+b.id+'&quot;)" style="background:transparent;border:none;color:rgba(231,76,60,.3);cursor:pointer;display:flex;padding:3px;">'+SVG_TRASH+'</button>'+
                    '</div>'+
                '</div>'+
            '</div>';
        }).join('');}
    }
    var today=new Date().toISOString().substring(0,10);
    var res=F.bets.filter(function(b){return b.status!=='pending'&&b.data.startsWith(today);});
    res.sort(function(a,b){return a.jogo.localeCompare(b.jogo);});
    var rE=document.getElementById('resolvList');
    if(rE){
        if(!res.length){rE.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.12);padding:14px;font-size:.85em;">Nenhuma hoje</div>';}
        else{rE.innerHTML=res.map(function(b){
            var co=b.status==='won'?'#2ecc71':b.status==='lost'?'#e74c3c':'rgba(255,255,255,.5)';
            var g=b.status==='won'?b.stake*(b.odd-1):b.status==='lost'?-b.stake:0;
            var dt=new Date(b.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
            var st=b.status==='won'?'GREEN':b.status==='lost'?'RED':'VOID';
            return '<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:.85em;">'+
                '<div style="flex:1;"><div style="color:#fff;font-weight:600;">'+b.jogo+'</div><div style="font-size:.75em;color:rgba(255,255,255,.3);margin-top:2px;">'+dt+' — Stake: R$ '+fmtBR(b.stake)+' — '+b.odd+'x</div></div>'+
                '<div style="text-align:right;"><div style="font-weight:700;color:'+co+';">'+(g>=0?'+':'')+' R$ '+fmtBR(Math.abs(g))+'</div><div style="font-size:.65em;color:'+co+';font-weight:600;">'+st+'</div></div>'+
            '</div>';
        }).join('');}
    }
    var mE=document.getElementById('spMovList');
    if(mE){
        mE.innerHTML=F.movs.slice(-10).reverse().map(function(m){
            var dt=new Date(m.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.025);font-size:.8em;">'+
                '<span style="color:rgba(255,255,255,.45);">'+dt+'</span>'+
                '<span style="font-weight:600;color:'+(m.tipo==='deposito'?'#2ecc71':'#e74c3c')+';">'+(m.tipo==='deposito'?'+':'-')+' R$ '+fmtBR(m.valor)+'</span>'+
                '<button onclick="delMov(&quot;'+m.id+'&quot;)" style="background:transparent;border:none;color:rgba(231,76,60,.2);cursor:pointer;display:flex;padding:2px;">'+SVG_TRASH+'</button>'+
            '</div>';
        }).join('');
    }
    // MENSAL — mes selecionado
    var mnE=document.getElementById('spMensal');
    if(mnE){
        var mk=mesAtual.y+'-'+String(mesAtual.m).padStart(2,'0');
        var meses=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        document.getElementById('mesLabel').textContent=meses[mesAtual.m]+' '+mesAtual.y;
        var mesBets=F.bets.filter(function(b){return b.data.startsWith(mk)&&b.status!=='pending';});
        var won=mesBets.filter(function(b){return b.status==='won';});
        var lost=mesBets.filter(function(b){return b.status==='lost';});
        var tW=won.reduce(function(s,b){return s+b.stake*(b.odd-1);},0);
        var tL=lost.reduce(function(s,b){return s+b.stake;},0);
        var luc=tW-tL;
        var wr=(won.length+lost.length)>0?Math.round(won.length/(won.length+lost.length)*100):0;
        mnE.innerHTML='<div class="grid-3" style="text-align:center;margin-bottom:10px;">'+
            '<div><div style="font-size:.6em;color:#2ecc71;font-weight:600;">GREENS</div><div style="font-size:1.2em;font-weight:700;color:#2ecc71;">'+won.length+'</div></div>'+
            '<div><div style="font-size:.6em;color:#e74c3c;font-weight:600;">REDS</div><div style="font-size:1.2em;font-weight:700;color:#e74c3c;">'+lost.length+'</div></div>'+
            '<div><div style="font-size:.6em;color:rgba(255,255,255,.4);font-weight:600;">WIN RATE</div><div style="font-size:1.2em;font-weight:700;color:'+(wr>=50?'#2ecc71':'#e74c3c')+';">'+wr+'%</div></div>'+
        '</div>'+
        '<div style="text-align:center;padding:10px;background:'+(luc>=0?'rgba(46,204,113,.05)':'rgba(231,76,60,.05)')+';border:1px solid '+(luc>=0?'rgba(46,204,113,.1)':'rgba(231,76,60,.1)')+';border-radius:8px;">'+
            '<div style="font-size:.6em;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Lucro / Prejuízo</div>'+
            '<div style="font-size:1.3em;font-weight:700;color:'+(luc>=0?'#2ecc71':'#e74c3c')+';">'+(luc>=0?'+':'')+' R$ '+fmtBR(Math.abs(luc))+'</div>'+
        '</div>';
        renderSemanas(mk,mesBets);
    }
    // TODAS — alfabetico
    var abE=document.getElementById('spAllBets');
    if(abE){
        var all=F.bets.slice().sort(function(a,b){return a.jogo.localeCompare(b.jogo)||new Date(b.data)-new Date(a.data);});
        if(!all.length){abE.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.12);padding:14px;font-size:.85em;">Nenhuma aposta</div>';}
        else{abE.innerHTML=all.map(function(b){
            var co=b.status==='won'?'#2ecc71':b.status==='lost'?'#e74c3c':b.status==='pending'?'#d4af7d':'rgba(255,255,255,.5)';
            var dt=new Date(b.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
            var st=b.status==='won'?'GREEN':b.status==='lost'?'RED':b.status==='pending'?'PEND':'VOID';
            var lucBet=b.status==='won'?b.stake*(b.odd-1):b.status==='lost'?-b.stake:0;
            var lucTxt=b.status==='pending'?'':('<div style="font-size:.82em;font-weight:700;color:'+co+';">'+(lucBet>=0?'+':'')+' R$ '+fmtBR(Math.abs(lucBet))+'</div>');
            return '<div style="display:flex;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.025);font-size:.8em;">'+
                '<div style="flex:1;"><div style="color:#fff;font-weight:600;">'+b.jogo+'</div><div style="font-size:.78em;color:rgba(255,255,255,.25);margin-top:1px;">'+dt+' — R$ '+fmtBR(b.stake)+' — '+b.odd+'x</div></div>'+
                '<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">'+
                    '<span style="font-size:.68em;font-weight:700;color:'+co+';letter-spacing:.5px;">'+st+'</span>'+
                    lucTxt+
                '</div>'+
                '<button onclick="deleteBet(&quot;'+b.id+'&quot;)" style="background:transparent;border:none;color:rgba(231,76,60,.15);cursor:pointer;display:flex;padding:2px;margin-left:6px;">'+SVG_TRASH+'</button>'+
            '</div>';
        }).join('');}
    }
}

// ==========================================
// INIT — IGUAL FINANCEIRO
// ==========================================
async function init(){
    await carregarSupabase();
    loadF();
    render();
}
init();
</script>

</body>
</html>
