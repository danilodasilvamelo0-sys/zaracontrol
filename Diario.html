<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZARA | Diário</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080808;--s1:#0f0f0f;--s2:#141414;--s3:#1a1a1a;
  --gold:#d4a843;--gold-b:#f0c040;--gold-dim:rgba(212,168,67,.08);--gold-mid:rgba(212,168,67,.28);
  --text:#f1f1f5;--td:rgba(241,241,245,.62);--tf:rgba(241,241,245,.35);
  --border:rgba(255,255,255,.07);--bm:rgba(212,168,67,.25);
}
html,body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body{padding-left:70px;padding-bottom:40px;transition:background .3s}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(212,168,67,.2)}

/* ── SIDEBAR ── */
.sidebar{position:fixed;top:0;left:0;width:60px;height:100vh;background:linear-gradient(180deg,#0f0f18,#0a0a12);border-right:1px solid rgba(212,168,67,.1);z-index:1000;display:flex;flex-direction:column;align-items:center;padding:16px 0;transition:width .3s cubic-bezier(.16,1,.3,1);overflow:hidden}
.sidebar:hover{width:200px}
.sidebar-logo{width:38px;height:38px;border:1px solid rgba(212,168,67,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:1.1em;font-weight:700;color:#c9a55a;margin-bottom:22px;flex-shrink:0;text-decoration:none;transition:all .3s}
.sidebar-logo:hover{background:rgba(212,168,67,.1)}
.sidebar-menu{display:flex;flex-direction:column;gap:4px;width:100%;flex:1}
.sidebar-menu a{display:flex;align-items:center;gap:12px;padding:12px 10px;color:rgba(255,255,255,.4);text-decoration:none;font-size:.78em;font-weight:500;transition:all .3s;border-left:2px solid transparent;white-space:nowrap}
.sidebar-menu a:hover{background:rgba(212,168,67,.07);border-left-color:#c9a55a;color:rgba(255,255,255,.85)}
.sidebar-menu a.active{background:rgba(212,168,67,.1);border-left-color:#c9a55a;color:#d4a843}
.sidebar-menu a svg{width:20px;height:20px;min-width:20px;margin-left:10px;stroke:currentColor;fill:none;stroke-width:1.5}
.sidebar-menu a span{opacity:0;transition:opacity .3s;font-weight:500}
.sidebar:hover .sidebar-menu a span{opacity:1}
.sidebar-divider{height:1px;background:rgba(212,168,67,.12);margin:8px 10px;width:calc(100% - 20px)}
.sidebar-footer{padding:14px 10px;text-align:center;border-top:1px solid rgba(212,168,67,.1);width:100%}
.sidebar-footer p{color:rgba(255,255,255,.25);font-size:.65em;text-transform:uppercase;letter-spacing:.8px;line-height:1.7;opacity:0;transition:opacity .3s}
.sidebar-footer .inst{font-size:.85em;color:#c9a55a;display:block;margin-bottom:2px}
.sidebar:hover .sidebar-footer p{opacity:1}

/* ── MOBILE NAV ── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#111118,#0d0d14);border-top:1px solid rgba(212,168,67,.12);padding:8px 0;z-index:1000}
.mobile-nav-items{display:flex;justify-content:space-around;align-items:center}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.35);text-decoration:none;font-size:.58em;padding:5px 8px;transition:all .3s;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.mobile-nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.mobile-nav-item.active{color:#d4a843}

@media(max-width:768px){body{padding-left:0!important;padding-bottom:80px!important}.sidebar{display:none!important}.mobile-nav{display:block}}
@media(min-width:769px){.mobile-nav{display:none!important}}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh;max-width:1200px;margin:0 auto}
.sidebar-list{border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.main-area{padding:0}

/* ── LISTA DE ENTRADAS ── */
.list-header{padding:24px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.list-title{font-family:'Montserrat',sans-serif;font-size:.72em;font-weight:700;letter-spacing:3px;color:var(--td);text-transform:uppercase}
.btn-nova{background:transparent;border:1px solid var(--bm);color:var(--gold);padding:7px 14px;font-family:'Montserrat',sans-serif;font-size:.65em;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:all .25s;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.btn-nova:hover{background:var(--gold-dim);border-color:var(--gold)}
.btn-nova svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5}

.search-wrap{padding:12px 16px;border-bottom:1px solid var(--border)}
.search-inp{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'Montserrat',sans-serif;font-size:.78em;padding:8px 12px;outline:none;transition:border-color .2s}
.search-inp:focus{border-color:var(--gold-mid)}
.search-inp::placeholder{color:var(--tf)}

.entries-scroll{flex:1;overflow-y:auto;padding:8px 0}
.entry-item{padding:14px 20px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03);transition:background .2s;position:relative;border-left:2px solid transparent}
.entry-item:hover{background:rgba(255,255,255,.02)}
.entry-item.active{background:rgba(212,168,67,.05);border-left-color:var(--gold)}
.entry-item-date{font-size:.62em;font-weight:600;letter-spacing:1px;color:var(--tf);text-transform:uppercase;margin-bottom:4px}
.entry-item-title{font-size:.85em;font-weight:500;color:var(--td);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-item-preview{font-size:.75em;color:var(--tf);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.entry-item-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag-chip{font-size:.55em;padding:2px 7px;border:1px solid rgba(212,168,67,.2);color:rgba(212,168,67,.5);font-weight:600;letter-spacing:.5px;text-transform:uppercase}

.empty-list{padding:40px 20px;text-align:center;color:var(--tf);font-size:.8em;font-style:italic;line-height:1.8}

/* ── EDITOR ── */
.editor-wrap{min-height:100vh;display:flex;flex-direction:column}
.editor-toolbar{padding:20px 40px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.editor-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.editor-date-inp{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--td);font-family:'Montserrat',sans-serif;font-size:.75em;padding:4px 0;outline:none;cursor:pointer;transition:border-color .2s;width:130px}
.editor-date-inp:focus{border-bottom-color:var(--gold-mid)}
.editor-estado-inp{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--td);font-family:'Crimson Pro',serif;font-size:.95em;font-style:italic;padding:4px 0;outline:none;transition:border-color .2s;min-width:200px}
.editor-estado-inp:focus{border-bottom-color:var(--gold-mid)}
.editor-estado-inp::placeholder{color:var(--tf);font-style:italic}

.editor-actions{display:flex;align-items:center;gap:10px}
.btn-salvar{background:var(--gold-dim);border:1px solid var(--bm);color:var(--gold);padding:8px 20px;font-family:'Montserrat',sans-serif;font-size:.65em;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .25s;text-transform:uppercase}
.btn-salvar:hover{background:rgba(212,168,67,.18);border-color:var(--gold)}
.btn-salvar.saved{border-color:rgba(100,200,100,.4);color:rgba(100,200,100,.8);background:rgba(100,200,100,.06)}
.btn-del{background:transparent;border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.25);padding:8px 12px;font-family:'Montserrat',sans-serif;font-size:.65em;cursor:pointer;transition:all .25s}
.btn-del:hover{border-color:rgba(200,50,50,.4);color:rgba(200,80,80,.7)}

/* ── TAGS ── */
.tags-row{padding:12px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tags-label{font-size:.6em;font-weight:700;letter-spacing:2px;color:var(--tf);text-transform:uppercase;margin-right:4px}
.tag-btn{padding:4px 12px;border:1px solid var(--border);color:var(--tf);font-family:'Montserrat',sans-serif;font-size:.62em;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .2s;text-transform:uppercase;background:transparent}
.tag-btn:hover{border-color:var(--bm);color:var(--td)}
.tag-btn.on{border-color:var(--gold-mid);color:var(--gold);background:var(--gold-dim)}

/* ── ÁREA DE ESCRITA ── */
.writing-area{flex:1;padding:40px;max-width:780px;width:100%}
.page-title-inp{width:100%;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:1.5em;font-weight:600;letter-spacing:.5px;outline:none;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.page-title-inp::placeholder{color:rgba(255,255,255,.12)}
.writing-inp{width:100%;background:transparent;border:none;color:var(--td);font-family:'Crimson Pro',serif;font-size:1.15em;line-height:1.9;outline:none;resize:none;min-height:60vh;letter-spacing:.2px}
.writing-inp::placeholder{color:rgba(255,255,255,.1);font-style:italic}

/* ── EMPTY EDITOR ── */
.editor-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;text-align:center;gap:16px}
.editor-empty-title{font-family:'Crimson Pro',serif;font-size:1.4em;font-style:italic;color:rgba(255,255,255,.15)}
.editor-empty-sub{font-size:.72em;color:rgba(255,255,255,.1);letter-spacing:.5px}

/* ── LINHA DO TEMPO ── */
.timeline-btn{background:transparent;border:1px solid var(--border);color:var(--tf);padding:7px 14px;font-family:'Montserrat',sans-serif;font-size:.62em;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase}
.timeline-btn:hover{border-color:var(--bm);color:var(--td)}
.timeline-panel{display:none;padding:24px 40px;border-bottom:1px solid var(--border);background:var(--s1)}
.timeline-panel.show{display:block}
.timeline-title{font-size:.62em;font-weight:700;letter-spacing:2px;color:var(--tf);text-transform:uppercase;margin-bottom:16px}
.timeline-bars{display:flex;align-items:flex-end;gap:4px;height:60px}
.tbar{flex:1;background:var(--gold-dim);border-radius:2px 2px 0 0;transition:height .4s;position:relative;cursor:default;min-width:8px}
.tbar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--border);padding:4px 8px;font-family:'Montserrat',sans-serif;font-size:.6em;color:var(--td);white-space:nowrap;pointer-events:none;z-index:10}
.tbar-labels{display:flex;gap:4px;margin-top:4px}
.tbar-label{flex:1;font-size:.52em;color:var(--tf);text-align:center;text-transform:uppercase;letter-spacing:.3px;min-width:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:20px;padding:10px 18px;background:var(--s3);border:1px solid var(--bm);font-family:'Montserrat',sans-serif;font-size:.75em;color:var(--text);z-index:9999;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* ── LOADER ── */
.loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity .5s}
.loader.gone{opacity:0;pointer-events:none}
.loader-text{font-family:'Montserrat',sans-serif;font-size:.65em;letter-spacing:3px;color:var(--tf);text-transform:uppercase;animation:pulse 1.5s ease-in-out infinite}
.loader-bar{width:120px;height:1px;background:rgba(212,168,67,.15);overflow:hidden}
.loader-fill{height:100%;background:var(--gold);animation:loadbar 1.5s ease-out forwards}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes loadbar{from{width:0}to{width:100%}}

/* ── PDF EXPORT ── */
@media print{
  .sidebar,.mobile-nav,.sidebar-list,.editor-toolbar,.tags-row,.editor-actions,.timeline-panel,.toast,.loader{display:none!important}
  body{padding:0;background:#fff;color:#1a1a1a}
  .layout{display:block}
  .writing-area{padding:40px;max-width:100%}
  .page-title-inp,.writing-inp{color:#1a1a1a;font-size:14pt}
}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar-list{display:none}
  .mobile-entries-btn{display:flex}
}
</style>

<script>
const SUPABASE_URL = 'https://ltwamldgdwqzyssoukzl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0d2FtbGRnZHdxenlzc291a3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4NzEzMDUsImV4cCI6MjA4MjQ0NzMwNX0.UVyo0c0BHslB7mCU74Qx8rdo42HA0WPAyDQ6J-FIakE';
const USER_ID = 'default';
const TABLE = 'diario';

let sb = null;
let entradas = [];
let entradaAtual = null;
let tagsSel = [];
let autoSaveTimer = null;

// ── SUPABASE ──
async function initSupabase() {
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await carregar();
  } catch(e) {
    console.warn('Supabase falhou, usando localStorage:', e);
    carregarLocal();
  }
}

async function carregar() {
  try {
    const { data, error } = await sb.from(TABLE)
      .select('*')
      .eq('user_id', USER_ID)
      .order('data', { ascending: false });
    if (error) throw error;
    entradas = data || [];
  } catch(e) {
    console.warn('Fallback localStorage:', e);
    carregarLocal();
  }
  renderLista();
  renderTimeline();
}

function carregarLocal() {
  try { entradas = JSON.parse(localStorage.getItem('diario_v1') || '[]'); } catch(e) { entradas = []; }
}

async function salvarSupabase(entrada) {
  if (!sb) { salvarLocal(); return; }
  try {
    const { error } = await sb.from(TABLE).upsert({
      id: entrada.id,
      user_id: USER_ID,
      data: entrada.data,
      titulo: entrada.titulo,
      estado: entrada.estado,
      texto: entrada.texto,
      tags: entrada.tags,
      humor: entrada.humor,
      criado_em: entrada.criadoEm,
      atualizado_em: new Date().toISOString()
    }, { onConflict: 'id' });
    if (error) throw error;
  } catch(e) {
    console.warn('Supabase save falhou:', e);
    salvarLocal();
  }
}

async function deletarSupabase(id) {
  if (!sb) { salvarLocal(); return; }
  try {
    await sb.from(TABLE).delete().eq('id', id).eq('user_id', USER_ID);
  } catch(e) { console.warn('Delete falhou:', e); }
}

function salvarLocal() {
  localStorage.setItem('diario_v1', JSON.stringify(entradas));
}

// ── ENTRADAS ──
function gerarId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function hoje() { return new Date().toISOString().split('T')[0]; }

function novaEntrada() {
  entradaAtual = {
    id: gerarId(),
    data: hoje(),
    titulo: '',
    estado: '',
    texto: '',
    tags: [],
    humor: 5,
    criadoEm: new Date().toISOString()
  };
  tagsSel = [];
  abrirEditor(false);
}

function abrirEntrada(id) {
  const e = entradas.find(x => x.id === id);
  if (!e) return;
  entradaAtual = {...e};
  tagsSel = [...(e.tags || [])];
  // Mark active
  document.querySelectorAll('.entry-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.add('active');
  abrirEditor(true);
}

function abrirEditor(existente) {
  document.getElementById('editorEmpty').style.display = 'none';
  document.getElementById('editorToolbar').style.display = 'flex';
  document.getElementById('tagsRow').style.display = 'flex';
  document.getElementById('writingArea').style.display = 'block';
  document.getElementById('btnDel').style.display = existente ? 'block' : 'none';

  document.getElementById('editorDate').value = entradaAtual.data || hoje();
  document.getElementById('editorEstado').value = entradaAtual.estado || '';
  document.getElementById('editorTitulo').value = entradaAtual.titulo || '';
  document.getElementById('editorTexto').value = entradaAtual.texto || '';

  // Tags
  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.classList.toggle('on', tagsSel.includes(btn.dataset.tag));
  });

  // Reset save btn
  const btn = document.getElementById('btnSalvar');
  btn.textContent = 'Salvar';
  btn.classList.remove('saved');

  document.getElementById('editorTexto').focus();
}

function toggleTag(btn) {
  const tag = btn.dataset.tag;
  if (tagsSel.includes(tag)) {
    tagsSel = tagsSel.filter(t => t !== tag);
    btn.classList.remove('on');
  } else {
    tagsSel.push(tag);
    btn.classList.add('on');
  }
}

async function salvarEntrada() {
  if (!entradaAtual) return;
  entradaAtual.data = document.getElementById('editorDate').value || hoje();
  entradaAtual.estado = document.getElementById('editorEstado').value.trim();
  entradaAtual.titulo = document.getElementById('editorTitulo').value.trim();
  entradaAtual.texto = document.getElementById('editorTexto').value;
  entradaAtual.tags = [...tagsSel];
  entradaAtual.humor = calcHumor(entradaAtual.texto + ' ' + entradaAtual.estado);

  const idx = entradas.findIndex(e => e.id === entradaAtual.id);
  if (idx >= 0) entradas[idx] = {...entradaAtual};
  else entradas.unshift({...entradaAtual});

  entradas.sort((a, b) => b.data.localeCompare(a.data));

  await salvarSupabase(entradaAtual);
  salvarLocal();
  renderLista();
  renderTimeline();

  const btn = document.getElementById('btnSalvar');
  btn.textContent = '✓ Salvo';
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); }, 2000);
  showToast('Entrada salva.');
}

async function deletarAtual() {
  if (!entradaAtual) return;
  if (!confirm('Excluir esta entrada?')) return;
  entradas = entradas.filter(e => e.id !== entradaAtual.id);
  await deletarSupabase(entradaAtual.id);
  salvarLocal();
  entradaAtual = null;
  tagsSel = [];
  document.getElementById('editorEmpty').style.display = 'flex';
  document.getElementById('editorToolbar').style.display = 'none';
  document.getElementById('tagsRow').style.display = 'none';
  document.getElementById('writingArea').style.display = 'none';
  renderLista();
  renderTimeline();
  showToast('Entrada excluída.');
}

// ── RENDER LISTA ──
function formatData(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
}

function renderLista(filtro) {
  const list = document.getElementById('entriesList');
  const busca = (filtro || document.getElementById('searchInp')?.value || '').toLowerCase().trim();

  let dados = [...entradas];
  if (busca) dados = dados.filter(e =>
    (e.texto || '').toLowerCase().includes(busca) ||
    (e.titulo || '').toLowerCase().includes(busca) ||
    (e.estado || '').toLowerCase().includes(busca) ||
    (e.tags || []).some(t => t.includes(busca))
  );

  document.getElementById('totalLabel').textContent =
    entradas.length + ' ' + (entradas.length === 1 ? 'entrada' : 'entradas');

  if (!dados.length) {
    list.innerHTML = `<div class="empty-list">${busca ? 'Nenhum resultado.' : 'Nenhuma entrada ainda.\nClique em + Nova para começar.'}</div>`;
    return;
  }

  list.innerHTML = dados.map(e => {
    const isActive = entradaAtual && entradaAtual.id === e.id;
    const tags = (e.tags || []).map(t => `<span class="tag-chip">${t}</span>`).join('');
    const preview = (e.texto || '').slice(0, 60).replace(/\n/g, ' ');
    return `<div class="entry-item${isActive ? ' active' : ''}" data-id="${e.id}" onclick="abrirEntrada('${e.id}')">
      <div class="entry-item-date">${formatData(e.data)}</div>
      <div class="entry-item-title">${e.titulo || e.estado || 'Sem título'}</div>
      ${preview ? `<div class="entry-item-preview">${preview}</div>` : ''}
      ${tags ? `<div class="entry-item-tags">${tags}</div>` : ''}
    </div>`;
  }).join('');
}

function filtrarEntradas() {
  renderLista(document.getElementById('searchInp').value);
}

// ── TIMELINE ──
function calcHumor(texto) {
  const pos = ['bem', 'ótimo', 'feliz', 'confiante', 'vitória', 'consegui', 'foco', 'calmo', 'gratidão', 'conquista', 'progresso', 'disciplina'];
  const neg = ['mal', 'ruim', 'ansioso', 'ansiedade', 'raiva', 'recaída', 'falha', 'fraco', 'cansado', 'errei', 'perdi', 'medo', 'culpa'];
  const t = texto.toLowerCase();
  let score = 5;
  pos.forEach(p => { if (t.includes(p)) score = Math.min(10, score + 1); });
  neg.forEach(n => { if (t.includes(n)) score = Math.max(1, score - 1); });
  return score;
}

function toggleTimeline() {
  const p = document.getElementById('timelinePanel');
  p.classList.toggle('show');
}

function renderTimeline() {
  const ultimas = [...entradas].slice(0, 14).reverse();
  const bars = document.getElementById('timelineBars');
  const labels = document.getElementById('timelineLabels');
  if (!bars || !ultimas.length) return;

  const max = Math.max(...ultimas.map(e => e.humor || 5), 1);
  bars.innerHTML = ultimas.map(e => {
    const h = Math.round(((e.humor || 5) / 10) * 56) + 4;
    const opacity = 0.3 + ((e.humor || 5) / 10) * 0.7;
    const d = new Date((e.data || '') + 'T12:00:00');
    const label = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    return `<div class="tbar" style="height:${h}px;opacity:${opacity};background:linear-gradient(180deg,var(--gold-b),var(--gold))" data-tip="${label} · humor ${e.humor || 5}/10"></div>`;
  }).join('');
  labels.innerHTML = ultimas.map(e => {
    const d = new Date((e.data || '') + 'T12:00:00');
    return `<div class="tbar-label">${d.toLocaleDateString('pt-BR', {day:'2-digit'})}</div>`;
  }).join('');
}

// ── PDF ──
function exportarPDF() {
  if (!entradaAtual) { showToast('Abra uma entrada para exportar.'); return; }
  window.print();
}

// ── UTILS ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// Auto-save ao digitar
document.addEventListener('input', (e) => {
  if (['editorTexto','editorTitulo','editorEstado'].includes(e.target.id)) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => { if (entradaAtual) salvarEntrada(); }, 3000);
  }
});

// ── INIT ──
async function init() {
  await initSupabase();
  setTimeout(() => {
    document.getElementById('loader').classList.add('gone');
  }, 800);
}

init();
</script>
