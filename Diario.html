<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZARA | Diário</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#f5f4f1;min-height:100vh;padding:20px 20px 100px 80px;color:#1a1a1a;transition:padding-left .3s;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#b8972e,transparent);z-index:9999}
body::after{content:'';position:fixed;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(184,151,46,.3),transparent);z-index:9999}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:60px;height:100vh;background:linear-gradient(180deg,#fdfcf8 0%,#f8f6f0 100%);border-right:1px solid rgba(184,151,46,.12);z-index:1000;box-shadow:4px 0 20px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;padding:15px 0;transition:width .3s cubic-bezier(.16,1,.3,1);overflow:hidden}
.sidebar:hover{width:200px}
.sidebar-logo{width:40px;height:40px;background:transparent;border:1px solid rgba(184,151,46,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:1.2em;font-weight:700;color:#7a5c10;margin-bottom:20px;flex-shrink:0;text-decoration:none;transition:all .3s}
.sidebar-logo:hover{background:rgba(184,151,46,.08)}
.sidebar-menu{display:flex;flex-direction:column;gap:5px;width:100%;flex:1}
.sidebar-menu a{display:flex;align-items:center;gap:12px;padding:12px 10px;color:rgba(26,26,26,.6);text-decoration:none;font-size:.82em;font-weight:500;transition:all .3s;border-left:2px solid transparent;white-space:nowrap;font-family:'Montserrat',sans-serif}
.sidebar-menu a:hover{background:rgba(184,151,46,.07);border-left-color:#b8972e;color:#1a1a1a}
.sidebar-menu a.active{background:rgba(184,151,46,.1);border-left-color:#b8972e;color:#7a5c10}
.sidebar-menu a svg{width:20px;height:20px;min-width:20px;margin-left:10px;stroke:currentColor;fill:none;stroke-width:1.5}
.sidebar-menu a span{opacity:0;transition:opacity .3s;font-weight:500}
.sidebar:hover .sidebar-menu a span{opacity:1}
.sidebar-divider{height:1px;background:rgba(184,151,46,.15);margin:8px 10px;width:calc(100% - 20px)}
.sidebar-footer{padding:15px 10px;text-align:center;border-top:1px solid rgba(184,151,46,.15);width:100%}
.sidebar-footer p{color:rgba(26,26,26,.5);font-size:.7em;text-transform:uppercase;letter-spacing:.5px;line-height:1.6;opacity:0;transition:opacity .3s;font-family:'Montserrat',sans-serif}
.sidebar-footer .instituto{font-size:.85em;color:#7a5c10;display:block;margin-bottom:3px}
.sidebar:hover .sidebar-footer p{opacity:1}

/* MOBILE NAV */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#fff 0%,#fdfcf8 100%);border-top:1px solid rgba(184,151,46,.12);box-shadow:0 -2px 16px rgba(0,0,0,.06);padding:8px 0;z-index:1000}
.mobile-nav-items{display:flex;justify-content:space-around;align-items:center}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(26,26,26,.5);text-decoration:none;font-size:.6em;padding:5px 8px;transition:all .3s;font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-family:'Montserrat',sans-serif}
.mobile-nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.mobile-nav-item.active{color:#8a6d1a}
.mobile-nav-item:hover{color:#5a4a0e}

@media(max-width:768px){body{padding-left:10px!important;padding-bottom:80px!important}.sidebar{display:none!important}.mobile-nav{display:block}}
@media(min-width:769px){body{padding-left:80px}.mobile-nav{display:none!important}}

/* MAIN CONTENT */
.main-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(184,151,46,.15)}
.main-header h1{font-family:'Montserrat',sans-serif;font-size:1.8em;font-weight:300;color:#1a1a1a;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
.main-header p{color:rgba(26,26,26,.5);font-size:.8em;font-weight:400;letter-spacing:.3px}

/* DIÁRIO CONTENT */
.diario-wrap{max-width:800px}
.diario-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid rgba(184,151,46,.15)}
.dtab{padding:10px 20px;background:transparent;border:none;border-bottom:2px solid transparent;color:rgba(26,26,26,.5);font-family:'Montserrat',sans-serif;font-size:.78em;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .3s;text-transform:uppercase;margin-bottom:-1px}
.dtab.on{border-bottom-color:#b8972e;color:#7a5c10}
.dtab:hover:not(.on){color:#1a1a1a}
.dpanel{display:none}.dpanel.on{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* FORM */
.dcard{background:#fff;border:1px solid rgba(184,151,46,.12);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.dcard-title{font-family:'Montserrat',sans-serif;font-size:.7em;font-weight:700;letter-spacing:2px;color:#8a6d1a;text-transform:uppercase;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(184,151,46,.1)}
.dform-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.dform-group{display:flex;flex-direction:column;gap:6px}
.dform-group label{font-family:'Montserrat',sans-serif;font-size:.65em;font-weight:600;letter-spacing:1.5px;color:rgba(26,26,26,.55);text-transform:uppercase}
.dform-group input,.dform-group select,.dform-group textarea{background:#fafaf8;border:1px solid rgba(184,151,46,.2);border-radius:8px;padding:10px 12px;font-family:'Montserrat',sans-serif;font-size:.85em;color:#1a1a1a;outline:none;transition:border-color .2s;width:100%}
.dform-group input:focus,.dform-group select:focus,.dform-group textarea:focus{border-color:#b8972e;box-shadow:0 0 0 3px rgba(184,151,46,.08)}
.dform-group textarea{resize:none;min-height:100px;line-height:1.6}
.nota-display{font-family:'Montserrat',sans-serif;font-size:1.4em;font-weight:700;color:#8a6d1a;text-align:center;margin-bottom:6px}
input[type=range]{width:100%;accent-color:#b8972e}
.emocoes-grid{display:flex;flex-wrap:wrap;gap:6px}
.emocao-chip{padding:5px 12px;border:1px solid rgba(184,151,46,.2);border-radius:20px;background:transparent;font-family:'Montserrat',sans-serif;font-size:.7em;font-weight:500;color:rgba(26,26,26,.6);cursor:pointer;transition:all .2s;letter-spacing:.3px}
.emocao-chip.sel{background:rgba(184,151,46,.12);border-color:#b8972e;color:#7a5c10}
.dbtn{padding:12px 28px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:.78em;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:all .2s;text-transform:uppercase;border:none}
.dbtn-primary{background:linear-gradient(135deg,#8a6d1a,#b8972e);color:#fff;box-shadow:0 4px 16px rgba(184,151,46,.3)}
.dbtn-primary:hover{box-shadow:0 6px 20px rgba(184,151,46,.4);transform:translateY(-1px)}
.dbtn-ghost{background:transparent;border:1px solid rgba(184,151,46,.3);color:#8a6d1a}
.dbtn-ghost:hover{background:rgba(184,151,46,.06)}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* ENTRIES */
.entries-list{display:flex;flex-direction:column;gap:12px}
.entry-card{background:#fff;border:1px solid rgba(184,151,46,.12);border-radius:10px;padding:18px 20px;cursor:pointer;transition:all .3s;box-shadow:0 1px 8px rgba(0,0,0,.03)}
.entry-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.entry-date{font-size:.7em;font-weight:600;color:rgba(26,26,26,.4);letter-spacing:.5px;text-transform:uppercase}
.entry-nota{font-family:'Montserrat',sans-serif;font-size:.75em;font-weight:700;color:#8a6d1a;background:rgba(184,151,46,.1);padding:2px 8px;border-radius:10px}
.entry-estado{font-weight:600;font-size:.9em;color:#1a1a1a;margin-bottom:6px}
.entry-emocao{display:inline-block;padding:3px 10px;border:1px solid rgba(184,151,46,.25);border-radius:12px;font-size:.68em;color:#8a6d1a;font-weight:500;margin-bottom:8px}
.entry-preview{font-size:.82em;color:rgba(26,26,26,.55);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.entry-expanded{margin-top:12px;padding-top:12px;border-top:1px solid rgba(184,151,46,.1)}
.entry-section{margin-bottom:8px}
.entry-section-label{font-size:.62em;font-weight:700;letter-spacing:1.5px;color:rgba(26,26,26,.4);text-transform:uppercase;margin-bottom:3px}
.entry-section-text{font-size:.83em;color:rgba(26,26,26,.75);line-height:1.6}
.entry-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.ea-btn{padding:6px 14px;border-radius:6px;font-family:'Montserrat',sans-serif;font-size:.68em;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-transform:uppercase}
.ea-edit{background:rgba(184,151,46,.1);border:1px solid rgba(184,151,46,.25);color:#8a6d1a}
.ea-del{background:rgba(200,50,50,.08);border:1px solid rgba(200,50,50,.2);color:#c03232}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid rgba(184,151,46,.12);border-radius:10px;padding:18px;text-align:center}
.stat-val{font-family:'Montserrat',sans-serif;font-size:1.8em;font-weight:700;color:#8a6d1a;display:block;margin-bottom:3px}
.stat-lbl{font-size:.65em;font-weight:600;color:rgba(26,26,26,.4);letter-spacing:1px;text-transform:uppercase}
.busca-bar{display:flex;gap:10px;margin-bottom:16px}
.busca-inp{flex:1;background:#fff;border:1px solid rgba(184,151,46,.2);border-radius:8px;padding:10px 14px;font-family:'Montserrat',sans-serif;font-size:.85em;outline:none;color:#1a1a1a;transition:border-color .2s}
.busca-inp:focus{border-color:#b8972e}
.busca-sel{background:#fff;border:1px solid rgba(184,151,46,.2);border-radius:8px;padding:10px 12px;font-family:'Montserrat',sans-serif;font-size:.82em;color:#1a1a1a;outline:none;cursor:pointer}
.empty-state{text-align:center;padding:50px 20px;color:rgba(26,26,26,.35)}
.empty-state svg{width:40px;height:40px;stroke:rgba(184,151,46,.4);fill:none;stroke-width:1.5;margin:0 auto 12px;display:block}
.empty-state p{font-size:.85em;font-weight:500}

@media(max-width:600px){.dform-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}.btn-row{flex-direction:column}}
</style>
</head>

<div class="diario-wrap">
    <div class="main-header">
        <h1>Diário</h1>
        <p>Registros, reflexões e estado mental</p>
    </div>

    <div class="diario-tabs">
        <button class="dtab on" onclick="switchDTab('escrever',this)">✦ Escrever</button>
        <button class="dtab" onclick="switchDTab('entradas',this)">Entradas</button>
        <button class="dtab" onclick="switchDTab('stats',this)">Análise</button>
    </div>

    <!-- ESCREVER -->
    <div class="dpanel on" id="dpanel-escrever">
        <div class="dcard">
            <div class="dcard-title" id="form-title">Nova Entrada</div>
            <div class="dform-row">
                <div class="dform-group">
                    <label>Data</label>
                    <input type="date" id="finp-data" />
                </div>
                <div class="dform-group">
                    <label>Estado Mental</label>
                    <input type="text" id="finp-estado" placeholder="Como você está?" maxlength="60" />
                </div>
            </div>
            <div class="dform-group" style="margin-bottom:16px">
                <label>Nota do dia — <span id="nota-display">7</span>/10</label>
                <input type="range" id="finp-nota" min="1" max="10" value="7" oninput="document.getElementById('nota-display').textContent=this.value" />
            </div>
            <div class="dform-group" style="margin-bottom:16px">
                <label>Emoção dominante</label>
                <div class="emocoes-grid" id="emocoes-grid"></div>
            </div>
            <div class="dform-group" style="margin-bottom:16px">
                <label>Reflexão do dia</label>
                <textarea id="finp-texto" placeholder="O que aconteceu? O que pensou? O que sentiu?" rows="5"></textarea>
            </div>
            <div class="dform-row">
                <div class="dform-group">
                    <label>Vitória do dia</label>
                    <input type="text" id="finp-vitoria" placeholder="O que você venceu hoje?" maxlength="120" />
                </div>
                <div class="dform-group">
                    <label>Falha do dia</label>
                    <input type="text" id="finp-falha" placeholder="O que você pode melhorar?" maxlength="120" />
                </div>
            </div>
            <div class="btn-row">
                <button class="dbtn dbtn-ghost" onclick="limparForm()">Limpar</button>
                <button class="dbtn dbtn-primary" onclick="salvarEntrada()">Salvar Entrada</button>
            </div>
        </div>
    </div>

    <!-- ENTRADAS -->
    <div class="dpanel" id="dpanel-entradas">
        <div class="busca-bar">
            <input class="busca-inp" id="busca-inp" type="text" placeholder="Buscar por texto ou estado..." oninput="renderEntradas()" />
            <select class="busca-sel" id="filtro-emocao" onchange="renderEntradas()">
                <option value="">Todas as emoções</option>
            </select>
        </div>
        <div class="entries-list" id="entries-list"></div>
    </div>

    <!-- STATS -->
    <div class="dpanel" id="dpanel-stats">
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-val" id="st-total">0</span><span class="stat-lbl">Entradas</span></div>
            <div class="stat-card"><span class="stat-val" id="st-media">0</span><span class="stat-lbl">Média</span></div>
            <div class="stat-card"><span class="stat-val" id="st-indice">0</span><span class="stat-lbl">Índice</span></div>
        </div>
        <div class="dcard">
            <div class="dcard-title">Emoções mais registradas</div>
            <div id="st-emocoes" style="display:flex;flex-wrap:wrap;gap:8px;min-height:40px"></div>
        </div>
        <div class="dcard">
            <div class="dcard-title">Últimas notas</div>
            <div id="st-chart" style="display:flex;align-items:flex-end;gap:4px;height:80px;padding:4px 0"></div>
        </div>
    </div>
</div>

<script>
const SK = 'diario_v2';
const EMOCOES = ["Controle","Raiva","Foco","Culpa","Ambição","Vazio","Clareza","Tensão","Poder","Ansiedade","Frieza","Impulso"];
let entradas = [];
let editandoId = null;
let emocaoSel = '';
let expandido = null;

function load(){
    try{ entradas = JSON.parse(localStorage.getItem(SK)||'[]'); }
    catch(e){ entradas = []; }
}
function save(){ localStorage.setItem(SK, JSON.stringify(entradas)); }
function gerarId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function formatarData(iso){
    if(!iso) return '';
    const d = new Date(iso+'T12:00:00');
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
}

function switchDTab(id, btn){
    document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.dpanel').forEach(p=>p.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('dpanel-'+id).classList.add('on');
    if(id==='entradas') renderEntradas();
    if(id==='stats') renderStats();
}

function renderEmocoes(sel){
    const g = document.getElementById('emocoes-grid');
    if(!g) return;
    g.innerHTML = EMOCOES.map(e=>`<button class="emocao-chip${e===sel?' sel':''}" onclick="selectEmocao('${e}')">${e}</button>`).join('');
    emocaoSel = sel||'';
}

function selectEmocao(e){
    emocaoSel = emocaoSel===e?'':e;
    renderEmocoes(emocaoSel);
}

function salvarEntrada(){
    const estado = document.getElementById('finp-estado').value.trim();
    const texto = document.getElementById('finp-texto').value.trim();
    if(!estado && !texto){ alert('Preencha ao menos o estado mental ou a reflexão.'); return; }
    const entrada = {
        id: editandoId || gerarId(),
        data: document.getElementById('finp-data').value || new Date().toISOString().split('T')[0],
        estadoMental: estado,
        nota: parseInt(document.getElementById('finp-nota').value)||7,
        emocao: emocaoSel,
        texto: texto,
        vitoria: document.getElementById('finp-vitoria').value.trim(),
        falha: document.getElementById('finp-falha').value.trim(),
        criadoEm: new Date().toISOString(),
    };
    if(editandoId){
        const idx = entradas.findIndex(e=>e.id===editandoId);
        if(idx>=0) entradas[idx] = entrada;
    } else {
        entradas.unshift(entrada);
    }
    save();
    limparForm();
    showToast('Entrada salva.');
}

function limparForm(){
    editandoId = null;
    document.getElementById('form-title').textContent = 'Nova Entrada';
    document.getElementById('finp-data').value = new Date().toISOString().split('T')[0];
    document.getElementById('finp-estado').value = '';
    document.getElementById('finp-nota').value = 7;
    document.getElementById('nota-display').textContent = '7';
    document.getElementById('finp-texto').value = '';
    document.getElementById('finp-vitoria').value = '';
    document.getElementById('finp-falha').value = '';
    renderEmocoes('');
}

function editarEntrada(id){
    const e = entradas.find(x=>x.id===id);
    if(!e) return;
    editandoId = id;
    document.getElementById('form-title').textContent = 'Editar Entrada';
    document.getElementById('finp-data').value = e.data||'';
    document.getElementById('finp-estado').value = e.estadoMental||'';
    document.getElementById('finp-nota').value = e.nota||7;
    document.getElementById('nota-display').textContent = e.nota||7;
    document.getElementById('finp-texto').value = e.texto||'';
    document.getElementById('finp-vitoria').value = e.vitoria||'';
    document.getElementById('finp-falha').value = e.falha||'';
    renderEmocoes(e.emocao||'');
    switchDTab('escrever', document.querySelectorAll('.dtab')[0]);
    window.scrollTo(0,0);
}

function deletarEntrada(id){
    if(!confirm('Remover esta entrada?')) return;
    entradas = entradas.filter(e=>e.id!==id);
    save();
    renderEntradas();
}

function renderEntradas(){
    const busca = (document.getElementById('busca-inp').value||'').toLowerCase();
    const filtroEm = document.getElementById('filtro-emocao').value||'';
    let lista = [...entradas];
    if(busca) lista = lista.filter(e=>(e.texto||'').toLowerCase().includes(busca)||(e.estadoMental||'').toLowerCase().includes(busca));
    if(filtroEm) lista = lista.filter(e=>e.emocao===filtroEm);
    const el = document.getElementById('entries-list');
    if(!el) return;
    if(!lista.length){
        el.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><p>Nenhuma entrada encontrada</p></div>`;
        return;
    }
    el.innerHTML = lista.map(e=>{
        const isExp = expandido===e.id;
        return `<div class="entry-card" onclick="toggleExpand('${e.id}')">
            <div class="entry-top">
                <div class="entry-date">${formatarData(e.data)}</div>
                <div class="entry-nota">${e.nota||'—'}/10</div>
            </div>
            <div class="entry-estado">${e.estadoMental||'—'}</div>
            ${e.emocao?`<div class="entry-emocao">${e.emocao}</div>`:''}
            <div class="entry-preview">${e.texto||''}</div>
            ${isExp?`<div class="entry-expanded">
                ${e.vitoria?`<div class="entry-section"><div class="entry-section-label">Vitória</div><div class="entry-section-text">${e.vitoria}</div></div>`:''}
                ${e.falha?`<div class="entry-section"><div class="entry-section-label">Falha</div><div class="entry-section-text">${e.falha}</div></div>`:''}
                <div class="entry-actions">
                    <button class="ea-btn ea-edit" onclick="event.stopPropagation();editarEntrada('${e.id}')">Editar</button>
                    <button class="ea-btn ea-del" onclick="event.stopPropagation();deletarEntrada('${e.id}')">Excluir</button>
                </div>
            </div>`:''}
        </div>`;
    }).join('');
    // Update filtro options
    const sel = document.getElementById('filtro-emocao');
    if(sel && sel.options.length<=1){
        const ems = [...new Set(entradas.map(e=>e.emocao).filter(Boolean))];
        ems.forEach(em=>{ const o=document.createElement('option');o.value=em;o.textContent=em;sel.appendChild(o); });
    }
}

function toggleExpand(id){
    expandido = expandido===id?null:id;
    renderEntradas();
}

function renderStats(){
    const total = entradas.length;
    const media = total ? (entradas.reduce((s,e)=>s+(e.nota||5),0)/total).toFixed(1) : 0;
    const indice = total ? Math.round(parseFloat(media)*10) : 0;
    document.getElementById('st-total').textContent = total;
    document.getElementById('st-media').textContent = media;
    document.getElementById('st-indice').textContent = indice;
    // Emocoes
    const emCount = {};
    entradas.forEach(e=>{ if(e.emocao) emCount[e.emocao]=(emCount[e.emocao]||0)+1; });
    const sorted = Object.entries(emCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
    document.getElementById('st-emocoes').innerHTML = sorted.map(([em,ct])=>`<span class="emocao-chip sel">${em} <strong>${ct}</strong></span>`).join('');
    // Chart
    const last = [...entradas].slice(0,14).reverse();
    const max = Math.max(...last.map(e=>e.nota||0),1);
    document.getElementById('st-chart').innerHTML = last.map(e=>{
        const h = Math.round(((e.nota||5)/max)*70);
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
            <div style="width:100%;background:rgba(184,151,46,.15);border-radius:3px;height:${h}px;min-height:4px;background:linear-gradient(180deg,#b8972e,rgba(184,151,46,.4))"></div>
            <span style="font-size:.55em;color:rgba(26,26,26,.4)">${e.nota}</span>
        </div>`;
    }).join('');
}

function showToast(msg){
    let t=document.getElementById('dtoast');
    if(!t){ t=document.createElement('div');t.id='dtoast';t.style.cssText='position:fixed;bottom:90px;right:16px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-family:Montserrat,sans-serif;font-size:.8em;font-weight:500;z-index:9999;opacity:0;transform:translateY(8px);transition:all .3s';document.body.appendChild(t); }
    t.textContent=msg;t.style.opacity='1';t.style.transform='translateY(0)';
    clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(8px)'},2500);
}

function init(){
    load();
    limparForm();
    // Set today's date
    document.getElementById('finp-data').value = new Date().toISOString().split('T')[0];
}

init();
</script>
</body>
