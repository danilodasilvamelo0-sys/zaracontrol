<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZARA | Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        :root {
            --gold:    #34d17a;
            --gold-b:  #5ef09b;
            --bg:      #060b08;
            --text:    #eef7f1;
            --text-dim:rgba(238,247,241,0.42);
        }

        html, body { min-height:100%; background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; overflow-x:hidden; }

        /* Grade de fundo */
        body::before {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image:
                linear-gradient(rgba(52,209,122,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52,209,122,0.03) 1px, transparent 1px);
            background-size: 72px 72px;
        }
        /* Brilho radial topo */
        body::after {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background:
                /* key light — foco cênico vindo de cima */
                radial-gradient(ellipse 70% 45% at 50% -5%,  rgba(52,209,122,0.30) 0%, transparent 65%),
                /* fill light lateral */
                radial-gradient(ellipse 55% 50% at 8% 32%,   rgba(28,180,140,0.20) 0%, transparent 62%),
                /* rim light oposto */
                radial-gradient(ellipse 55% 50% at 95% 68%,  rgba(94,240,155,0.18) 0%, transparent 62%),
                /* vinheta — escurece as bordas, foco no centro */
                radial-gradient(ellipse 95% 80% at 50% 45%,  transparent 40%, rgba(0,0,0,0.55) 100%);
        }

        .page {
            position:relative; z-index:1;
            min-height:100vh;
            display:flex; flex-direction:column; align-items:center;
            padding: 56px 20px 52px;
        }

        /* ── HERO ── */
        .hero { text-align:center; margin-bottom:56px; animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) both; }

        .logo-wrap {
            position: relative;
            width: 116px; height: 116px;
            margin: 0 auto;
            animation: float 7s ease-in-out infinite;
        }

        /* Luz orbitando o aro — feixe girando ao redor do vidro */
        .logo-wrap::before {
            content: '';
            position: absolute; inset: -5px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 55deg,
                rgba(52,209,122,0.35)  85deg,
                rgba(150,255,205,0.95) 108deg,
                rgba(52,209,122,0.30) 132deg,
                transparent 175deg,
                transparent 360deg
            );
            -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
                    mask: radial-gradient(closest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            animation: orbit 5.5s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        /* Halo que se expande e some — pulso cênico */
        .logo-wrap::after {
            content: '';
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(94,240,155,0.55);
            animation: halo 4s cubic-bezier(0.16,1,0.3,1) infinite;
            pointer-events: none;
        }

        /* Círculo espelhado dourado — igual aos cards mas circular */
        .logo-inner {
            position: absolute;
            inset: 0;
            border-radius: 50%;

            /* Gradiente dourado espelhado */
            background:
                linear-gradient(150deg, rgba(255,255,255,0.20) 0%, rgba(94,240,155,0.07) 30%, transparent 62%),
                linear-gradient(150deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 35%, rgba(255,255,255,0.03) 65%, rgba(255,255,255,0.10) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);

            /* Moldura cromada dourada */
            border: 1px solid rgba(94,240,155,0.30);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.35),
                inset 0 -2px 6px rgba(0,0,0,0.4),
                0 6px 20px rgba(0,0,0,0.6),
                0 16px 44px rgba(0,0,0,0.55),
                0 0 44px rgba(52,209,122,0.22);
            animation: breathe 4.5s ease-in-out infinite;
            overflow: hidden;

            display: flex; align-items: center; justify-content: center;
        }

        /* Clarão especular varrendo o vidro */
        .logo-inner::before {
            content: '';
            position: absolute;
            top: -20%; bottom: -20%; left: -60%;
            width: 55%;
            background: linear-gradient(
                104deg,
                transparent 0%,
                rgba(255,255,255,0.10) 30%,
                rgba(210,255,232,0.42) 50%,
                rgba(255,255,255,0.10) 70%,
                transparent 100%
            );
            transform: skewX(-14deg);
            animation: sweep 5.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        /* Brilho pontual canto superior esquerdo */
        .logo-inner::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px;
            width: 50%; height: 50%;
            border-radius: 50%;
            z-index: 1;
            background: radial-gradient(
                circle at 30% 30%,
                rgba(255,255,255,0.28) 0%,
                rgba(94,240,155,0.08) 40%,
                transparent 70%
            );
            pointer-events: none;
        }

        .logo-z {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.9em; font-weight: 600;
            color: var(--gold-b);
            position: relative; z-index: 3;
            animation: zglow 4.5s ease-in-out infinite;
        }

        /* ══════════════════════════════════════
           CARDS ESPELHADOS / GLASS PREMIUM
        ══════════════════════════════════════ */
        .menu { width:100%; max-width:430px; display:grid; grid-template-columns:1fr 1fr; gap:30px 12px; }

        .card {
            position: relative;
            display: flex;
            padding: 0;
            min-height: 132px;
            text-decoration: none;
            border-radius: 0 20px 20px 20px;
            overflow: visible;
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease;
            animation: fadeUp 0.85s cubic-bezier(0.16,1,0.3,1) both;

            /* Glass — idêntico ao financeiro */
            background: linear-gradient(
                158deg,
                rgba(255,255,255,0.085) 0%,
                rgba(255,255,255,0.030) 28%,
                rgba(6,11,8,0.42)       62%,
                rgba(3,6,4,0.62)        100%
            );
            backdrop-filter: blur(26px) saturate(170%);
            -webkit-backdrop-filter: blur(26px) saturate(170%);
            border: 1px solid rgba(94,240,155,0.10);

            /* Moldura cromada + elevação */
            box-shadow:
                0 1px 0 rgba(255,255,255,0.14),
                -1px 0 0 rgba(255,255,255,0.06),
                1px 0 0 rgba(0,0,0,0.6),
                0 -1px 0 rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.26),
                inset 0 -2px 4px rgba(0,0,0,0.4),
                0 6px 12px rgba(0,0,0,0.5),
                0 16px 48px rgba(0,0,0,0.6),
                0 32px 80px rgba(0,0,0,0.4);
        }

        /* Reflexo de vidro superior */
        .card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 55%;
            border-radius: 0 20px 0 0;
            background: linear-gradient(
                150deg,
                rgba(255,255,255,0.07) 0%,
                rgba(255,255,255,0.025) 35%,
                transparent 65%
            );
            pointer-events: none; z-index: 1;
        }

        /* Brilho pontual canto superior */
        .card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 150px; height: 150px;
            border-radius: 0 0 70% 0;
            background: radial-gradient(
                circle at 12% 12%,
                rgba(255,255,255,0.05) 0%,
                rgba(255,255,255,0.015) 40%,
                transparent 62%
            );
            pointer-events: none; z-index: 1;
        }

        .card:hover, .card:active {
            transform: translateY(-3px);
            box-shadow:
                0 1px 0 rgba(255,255,255,0.28),
                -1px 0 0 rgba(255,255,255,0.14),
                1px 0 0 rgba(0,0,0,0.6),
                0 -1px 0 rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.10),
                inset 0 -2px 4px rgba(0,0,0,0.4),
                0 8px 16px rgba(0,0,0,0.55),
                0 24px 64px rgba(0,0,0,0.65),
                0 0 0 1px rgba(52,209,122,0.26),
                0 0 46px rgba(52,209,122,0.12);
        }
        .card:hover .card-icon, .card:active .card-icon { background:rgba(52,209,122,0.14); border-color:rgba(94,240,155,0.35); }
        .card:hover .card-icon svg, .card:active .card-icon svg { stroke:var(--gold-b); filter:drop-shadow(0 0 6px rgba(52,209,122,0.6)); }
        .card:hover .card-title, .card:active .card-title { color:var(--gold-b); }
        .card:hover .card-arrow, .card:active .card-arrow { opacity:1; transform:translateX(2px); }

        /* Conteúdo do card */
        .card-inner {
            position:relative; z-index:3;
            display:flex; flex-direction:column; align-items:flex-start;
            width:100%; padding:15px 14px 14px;
        }

        .card-icon {
            width:38px; height:38px; flex-shrink:0;
            border-radius:11px;
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.05);
            display:flex; align-items:center; justify-content:center;
            transition:all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .card-icon svg { width:17px; height:17px; stroke:rgba(238,247,241,0.34); transition:all 0.3s ease; }

        .card-text { margin-top:auto; padding-top:14px; min-width:0; width:100%; }
        .card-title {
            font-size:0.68em; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
            color:rgba(238,247,241,0.92); margin-bottom:4px;
            transition:color 0.3s ease;
        }
        .card-sub { font-size:0.53em; color:var(--text-dim); letter-spacing:0.3px; }

        .card-right { position:absolute; top:15px; right:13px; display:flex; align-items:center; z-index:3; }

        .card-num { display:none; }

        .card-arrow {
            color:rgba(94,240,155,0.75); opacity:0;
            transition:all 0.3s ease;
        }
        .card-arrow svg { width:14px; height:14px; }

        /* Linha dourada esquerda no hover */
        /* Aba da pasta — corte diagonal fluindo para o corpo */
        .card-accent {
            position:absolute;
            top:-19px; left:0; z-index:0;
            width:66%; height:21px;
            border-radius:12px 0 0 0;

            /* o corte: sobe reto, corre no topo e desce em diagonal */
            -webkit-clip-path: polygon(0 0, 68% 0, 73% 3%, 77% 11%, 79% 24%, 80% 46%, 81% 64%, 83% 79%, 87% 91%, 93% 98%, 100% 100%, 0 100%);
                    clip-path: polygon(0 0, 68% 0, 73% 3%, 77% 11%, 79% 24%, 80% 46%, 81% 64%, 83% 79%, 87% 91%, 93% 98%, 100% 100%, 0 100%);

            /* fio de luz no topo embutido no gradiente (borda seria cortada) */
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0.075) 0px,
                rgba(255,255,255,0.045) 1px,
                rgba(255,255,255,0.022) 100%
            );
            backdrop-filter: blur(26px) saturate(170%);
            -webkit-backdrop-filter: blur(26px) saturate(170%);
            transition: background 0.3s ease;
        }
        .card:hover .card-accent, .card:active .card-accent {
            background: linear-gradient(
                to bottom,
                rgba(94,240,155,0.20) 0px,
                rgba(94,240,155,0.07) 1px,
                rgba(255,255,255,0.035) 100%
            );
        }

        /* Delays das animações */
        .card:nth-child(1) { animation-delay:0.30s; }
        .card:nth-child(2) { animation-delay:0.41s; }
        .card:nth-child(3) { animation-delay:0.52s; }
        .card:nth-child(4) { animation-delay:0.63s; }
        .card:nth-child(5) { animation-delay:0.74s; }

        /* ── FOOTER ── */
        .footer { margin-top:48px; text-align:center; animation:fadeUp 0.85s 0.95s cubic-bezier(0.16,1,0.3,1) both; }
        .footer-txt { font-size:0.52em; letter-spacing:4px; text-transform:uppercase; color:rgba(238,247,241,0.20); }
        .footer-hr { width:36px; height:1px; background:rgba(52,209,122,0.22); margin:8px auto 0; }

        /* ── ANIMAÇÕES ── */
        @keyframes pulse   { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
        /* entrada com leve escala — sensação de câmera aproximando */
        @keyframes fadeUp  {
            from { opacity:0; transform:translateY(22px) scale(0.985); filter:blur(6px); }
            to   { opacity:1; transform:translateY(0)    scale(1);     filter:blur(0); }
        }
        @keyframes orbit  { to { transform: rotate(360deg); } }
        @keyframes halo {
            0%       { transform: scale(1);    opacity: 0.55; }
            70%,100% { transform: scale(1.55); opacity: 0; }
        }
        @keyframes sweep {
            0%, 58%   { transform: translateX(0) skewX(-14deg); }
            88%, 100% { transform: translateX(320px) skewX(-14deg); }
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-6px); }
        }
        @keyframes zglow {
            0%,100% { text-shadow: 0 0 14px rgba(52,209,122,0.45), 0 0 34px rgba(52,209,122,0.18); }
            50%     { text-shadow: 0 0 22px rgba(94,240,155,0.75), 0 0 54px rgba(52,209,122,0.35); }
        }

        /* logo respirando */
        @keyframes breathe {
            0%,100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,0,0,0.4),
                                  0 6px 20px rgba(0,0,0,0.6), 0 16px 44px rgba(0,0,0,0.55),
                                  0 0 44px rgba(52,209,122,0.22); }
            50%     { box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,0,0,0.4),
                                  0 6px 20px rgba(0,0,0,0.6), 0 16px 44px rgba(0,0,0,0.55),
                                  0 0 66px rgba(52,209,122,0.38); }
        }

        @media (max-width:400px) {
            .page  { padding:44px 14px 44px; }
            .card-inner { padding:13px 12px 12px; }
            .menu { gap:28px 10px; }
        }
    </style>
</head>
<body>

        <div class="logo-wrap">
            <div class="logo-inner"><div class="logo-z">Z</div></div>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </div>

        <a href="comando.html" class="card">

    </nav>

    <div class="footer">
