<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <meta name="color-scheme" content="dark">
    <title>ZARA | Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #080808;
            --black-rich: #0f0f0f;
            --surface: #141414;
            --surface2: #1a1a1a;
            --gold: #8a6d1a;
            --gold-light: #b8972e;
            --gold-dark: #5a4a0e;
            --gold-glow: rgba(184, 151, 46, 0.07);
            --gold-border: rgba(184, 151, 46, 0.15);
            --text: #1a1a1a;
            --text-dim: rgba(26, 26, 26, 0.6);
            --text-muted: rgba(26, 26, 26, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: #080808;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%,
                var(--gold-dark) 15%,
                var(--gold) 35%,
                var(--gold-light) 50%,
                var(--gold) 65%,
                var(--gold-dark) 85%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: goldShimmer 8s ease-in-out infinite;
            z-index: 9999;
        }

        @keyframes goldShimmer {
            0%, 100% { background-position: 200% 0; }
            50% { background-position: -200% 0; }
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
            z-index: 9999;
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Logo */
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 40px;
            border: 1px solid var(--gold-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #0f0f0f;
            transition: all 0.5s ease;
        }

        .logo:hover {
            border-color: var(--gold);
            box-shadow: 0 0 40px rgba(184,151,46,0.12);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.4em;
            color: var(--gold);
            font-weight: 500;
            letter-spacing: 2px;
        }

        /* Title */
        h1 {
            font-family: 'Playfair Display', serif;
            color: #f0f0f0;
            font-size: 2.8em;
            font-weight: 500;
            letter-spacing: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #d4af46;
            font-size: 0.7em;
            margin-bottom: 50px;
            font-weight: 500;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 50px;
        }

        /* Menu */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 0;
            background: rgba(212,175,46,0.12);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(184,151,46,0.15);
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 22px 28px;
            background: var(--surface);
            text-decoration: none;
            color: var(--text);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            border-bottom: 1px solid rgba(184,151,46,0.06);
        }

        .menu-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 2px;
            background: var(--gold);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .menu-item:hover::before {
            transform: scaleY(1);
        }

        .menu-item:hover {
            background: #fdfcf8;
        }

        .menu-item .icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            transition: all 0.4s ease;
            background: #0f0f0f;
        }

        .menu-item .icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--gold);
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .menu-item:hover .icon {
            border-color: var(--gold);
            background: var(--gold-glow);
        }

        .menu-item:hover .icon svg {
            opacity: 1;
        }

        .menu-item .text {
            text-align: left;
            flex: 1;
        }

        .menu-item h3 {
            font-size: 0.95em;
            font-weight: 500;
            margin-bottom: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-item p {
            font-size: 0.72em;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .menu-item .arrow {
            color: var(--text-muted);
            transition: all 0.4s ease;
        }

        .menu-item:hover .arrow {
            transform: translateX(5px);
            color: var(--gold);
        }

        .menu-item .arrow svg {
            width: 18px;
            height: 18px;
        }

        /* Footer */
        .footer {
            margin-top: 60px;
            color: rgba(26,26,26,0.35);
            font-size: 0.65em;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: var(--gold-glow);
            border: 1px solid var(--gold-border);
            border-radius: 30px;
            font-size: 0.55em;
            color: var(--gold);
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
                letter-spacing: 8px;
            }

            .menu-item {
                padding: 18px 22px;
                gap: 18px;
            }

            .menu-item .icon {
                width: 42px;
                height: 42px;
            }

            .subtitle {
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="logo-text">Z</span>
        </div>
        
        <h1>ZARA</h1>
        <p class="subtitle">Private Access</p>
        
        <div class="badge">Exclusive</div>
        
        <div class="divider"></div>
        
        <nav class="menu">
            <a href="comando.html" class="menu-item">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <div class="text">
                    <h3>Comando</h3>
                    <p>Centro de controle estratégico</p>
                </div>
                <div class="arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </div>
            </a>
            
            <a href="saude.html" class="menu-item">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <div class="text">
                    <h3>Saúde</h3>
                    <p>Monitoramento e bem-estar</p>
                </div>
                <div class="arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </div>
            </a>
            
            <a href="financeiro.html" class="menu-item">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"/>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                </div>
                <div class="text">
                    <h3>Financeiro</h3>
                    <p>Gestão e planejamento</p>
                </div>
                <div class="arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </div>
            </a>
            <a href="Diario.html" class="menu-item">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                </div>
                <div class="text">
                    <h3>Diário</h3>
                    <p>Reflexões e registros diários</p>
                </div>
                <div class="arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </div>
            </a>
        </nav>
        
        <div class="footer">
            ZARA © 2024
        </div>
    </div>
</body>
</html>
