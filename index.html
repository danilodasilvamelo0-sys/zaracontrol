<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZARA | Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        :root {
            --gold:     #c9a84c;
            --gold-b:   #e8c160;
            --gold-dim: rgba(201,168,76,0.08);
            --gold-mid: rgba(201,168,76,0.18);
            --border:   rgba(201,168,76,0.15);
            --bg:       #060606;
            --s1:       #0c0c0c;
            --text:     #f5f0e8;
            --text-dim: rgba(245,240,232,0.45);
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* ── FUNDO COM GRID FUTURISTA ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 65%);
            pointer-events: none;
        }

        .page {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 48px;
        }

        /* ── TOPO ── */
        .hero { text-align: center; margin-bottom: 56px; }

        .logo-wrap {
            position: relative;
            width: 88px; height: 88px;
            margin: 0 auto 32px;
        }
        .logo-ring {
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 1px solid var(--border);
            animation: spin 12s linear infinite;
        }
        .logo-ring::before {
            content: '';
            position: absolute; top: -1px; left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 6px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--gold);
        }
        .logo-inner {
            position: absolute; inset: 8px;
            background: var(--s1);
            border-radius: 50%;
            border: 1px solid rgba(201,168,76,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .logo-z {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2em;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 2px;
            line-height: 1;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.8em;
            font-weight: 300;
            letter-spacing: 18px;
            text-transform: uppercase;
            color: var(--text);
            line-height: 1;
            margin-bottom: 10px;
        }
        .brand-sub {
            font-size: 0.60em;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.8;
        }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 28px auto;
            width: 180px;
        }
        .divider-line { flex: 1; height: 1px; background: var(--border); }
        .divider-diamond {
            width: 5px; height: 5px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        .access-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 22px;
            border: 1px solid var(--border);
            border-radius: 40px;
            font-size: 0.62em;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            background: var(--gold-dim);
        }
        .access-badge::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--gold);
            animation: pulse 2s ease-in-out infinite;
        }

        /* ── MENU CARDS ── */
        .menu {
            width: 100%; max-width: 480px;
            display: flex; flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            position: relative;
            display: flex; align-items: center;
            gap: 18px;
            padding: 18px 22px;
            text-decoration: none;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(12,12,12,0.8);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Borda dourada animada no hover */
        .menu-item::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, var(--gold), transparent 50%, var(--gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        /* Brilho lateral */
        .menu-item::after {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 2px;
            background: linear-gradient(transparent, var(--gold), transparent);
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .menu-item:hover,
        .menu-item:active {
            background: rgba(20,20,20,0.95);
            transform: translateX(4px);
            border-color: transparent;
        }
        .menu-item:hover::before,
        .menu-item:active::before { opacity: 1; }
        .menu-item:hover::after,
        .menu-item:active::after   { opacity: 1; }
        .menu-item:hover .icon,
        .menu-item:active .icon    { background: var(--gold-mid); border-color: var(--border); }
        .menu-item:hover .icon svg,
        .menu-item:active .icon svg { stroke: var(--gold-b); }
        .menu-item:hover .menu-title,
        .menu-item:active .menu-title { color: var(--gold-b); }
        .menu-item:hover .arrow,
        .menu-item:active .arrow   { opacity: 1; transform: translateX(3px); }

        /* Ícone */
        .icon {
            width: 46px; height: 46px;
            border-radius: 13px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.35s ease;
        }
        .icon svg {
            width: 20px; height: 20px;
            stroke: rgba(245,240,232,0.55);
            transition: stroke 0.35s ease;
        }

        /* Texto */
        .text { flex: 1; min-width: 0; }
        .menu-title {
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text);
            transition: color 0.35s ease;
            margin-bottom: 3px;
        }
        .menu-sub {
            font-size: 0.60em;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        /* Seta */
        .arrow {
            color: var(--gold);
            opacity: 0;
            transition: all 0.35s ease;
            flex-shrink: 0;
        }
        .arrow svg { width: 16px; height: 16px; }

        /* Número decorativo */
        .item-num {
            position: absolute;
            right: 20px; bottom: 10px;
            font-size: 0.45em;
            font-weight: 800;
            letter-spacing: 1px;
            color: rgba(201,168,76,0.12);
            font-family: 'Cormorant Garamond', serif;
        }

        /* ── FOOTER ── */
        .footer {
            margin-top: 52px;
            text-align: center;
        }
        .footer-text {
            font-size: 0.55em;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(245,240,232,0.2);
        }
        .footer-line {
            width: 40px; height: 1px;
            background: var(--border);
            margin: 10px auto 0;
        }

        /* ── ANIMAÇÕES ── */
        @keyframes spin  { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .hero           { animation: fadeUp 0.6s ease both; }
        .menu-item      { animation: fadeUp 0.5s ease both; }
        .menu-item:nth-child(1) { animation-delay: 0.10s; }
        .menu-item:nth-child(2) { animation-delay: 0.18s; }
        .menu-item:nth-child(3) { animation-delay: 0.26s; }
        .menu-item:nth-child(4) { animation-delay: 0.34s; }
        .menu-item:nth-child(5) { animation-delay: 0.42s; }
        .footer         { animation: fadeUp 0.5s ease 0.5s both; }

        @media (max-width: 420px) {
            .brand    { font-size: 3em; letter-spacing: 14px; }
            .page     { padding: 48px 16px 40px; }
            .menu-item{ padding: 16px 18px; }
            .icon     { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>
