<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZARA | Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        :root {
            --gold:    #c9a84c;
            --gold-b:  #e8c160;
            --bg:      #050505;
            --text:    #f5f0e8;
            --text-dim:rgba(245,240,232,0.4);
        }

        html, body { min-height:100%; background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; overflow-x:hidden; }

        /* Grade de fundo */
        body::before {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image:
                linear-gradient(rgba(201,168,76,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,168,76,0.025) 1px, transparent 1px);
            background-size: 72px 72px;
        }
        /* Brilho radial topo */
        body::after {
            content:''; position:fixed; top:0; left:0; right:0; height:50vh; z-index:0; pointer-events:none;
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 100%);
        }

        .page {
            position:relative; z-index:1;
            min-height:100vh;
            display:flex; flex-direction:column; align-items:center;
            padding: 56px 20px 52px;
        }

        /* ── HERO ── */
        .hero { text-align:center; margin-bottom:48px; animation: fadeUp 0.7s ease both; }

        .logo-wrap {
            position: relative;
            width: 90px; height: 90px;
            margin: 0 auto 32px;
        }

        /* Cantos futuristas — targeting UI */
        .logo-wrap::before,
        .logo-wrap::after {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            border-color: var(--gold);
            border-style: solid;
            opacity: 0.8;
            animation: cornerPulse 3s ease-in-out infinite;
        }
        .logo-wrap::before {
            top: 0; left: 0;
            border-width: 2px 0 0 2px;
        }
        .logo-wrap::after {
            bottom: 0; right: 0;
            border-width: 0 2px 2px 0;
            animation-delay: 1.5s;
        }

        /* Cantos extras via inner elements */
        .logo-corner-tr,
        .logo-corner-bl {
            position: absolute;
            width: 18px; height: 18px;
            border-color: var(--gold);
            border-style: solid;
            opacity: 0.8;
        }
        .logo-corner-tr {
            top: 0; right: 0;
            border-width: 2px 2px 0 0;
            animation: cornerPulse 3s ease-in-out 0.75s infinite;
        }
        .logo-corner-bl {
            bottom: 0; left: 0;
            border-width: 0 0 2px 2px;
            animation: cornerPulse 3s ease-in-out 2.25s infinite;
        }

        /* Linha de scan */
        .logo-scan {
            position: absolute;
            left: 8px; right: 8px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.6), transparent);
            animation: scan 3s ease-in-out infinite;
            top: 8px;
        }

        .logo-inner {
            position: absolute;
            inset: 10px;
            background: linear-gradient(145deg, #181818, #0c0c0c);
            border: 1px solid rgba(201,168,76,0.15);
            display: flex; align-items: center; justify-content: center;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.04),
                0 0 30px rgba(0,0,0,0.9),
                0 0 0 1px rgba(0,0,0,0.8);
        }

        .logo-z {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2em; font-weight: 600;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(201,168,76,0.4);
            position: relative; z-index: 1;
        }

        @keyframes cornerPulse {
            0%, 100% { opacity: 0.5; }
            50%       { opacity: 1; box-shadow: 0 0 6px rgba(201,168,76,0.4); }
        }
        @keyframes scan {
            0%   { top: 10px; opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: calc(100% - 10px); opacity: 0; }
        }

        .brand { font-family:'Cormorant Garamond',serif; font-size:3.6em; font-weight:300; letter-spacing:16px; text-transform:uppercase; margin-bottom:8px; }
        .brand-sub { font-size:0.58em; font-weight:700; letter-spacing:7px; text-transform:uppercase; color:var(--gold); opacity:0.75; }

        .divider { display:flex; align-items:center; gap:10px; margin:24px auto; width:160px; }
        .divider-line { flex:1; height:1px; background:rgba(201,168,76,0.2); }
        .divider-dot { width:4px; height:4px; background:var(--gold); transform:rotate(45deg); }

        .badge {
            display:inline-flex; align-items:center; gap:7px;
            padding:7px 20px; border-radius:40px;
            border:1px solid rgba(201,168,76,0.2);
            background:rgba(201,168,76,0.06);
            font-size:0.60em; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:var(--gold);
        }
        .badge-dot { width:5px; height:5px; background:var(--gold); border-radius:50%; box-shadow:0 0 5px var(--gold); animation:pulse 2s ease-in-out infinite; }

        /* ══════════════════════════════════════
           CARDS ESPELHADOS / GLASS PREMIUM
        ══════════════════════════════════════ */
        .menu { width:100%; max-width:460px; display:flex; flex-direction:column; gap:12px; }

        .card {
            position: relative;
            display: flex; align-items: center; gap: 16px;
            padding: 0;
            text-decoration: none;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease;
            animation: fadeUp 0.5s ease both;

            /* Glass — idêntico ao financeiro */
            background: linear-gradient(
                150deg,
                #2a2a2d 0%,
                #202022 20%,
                #1a1a1c 50%,
                #1e1e20 80%,
                #242426 100%
            );
            border: none;

            /* Moldura cromada + elevação */
            box-shadow:
                0 1px 0 rgba(255,255,255,0.22),
                -1px 0 0 rgba(255,255,255,0.10),
                1px 0 0 rgba(0,0,0,0.6),
                0 -1px 0 rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -2px 4px rgba(0,0,0,0.4),
                0 6px 12px rgba(0,0,0,0.5),
                0 16px 48px rgba(0,0,0,0.6),
                0 32px 80px rgba(0,0,0,0.4);
        }

        /* Reflexo de vidro superior */
        .card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 55%;
            border-radius: 20px 20px 0 0;
            background: linear-gradient(
                150deg,
                rgba(255,255,255,0.10) 0%,
                rgba(255,255,255,0.04) 35%,
                rgba(255,255,255,0.01) 60%,
                transparent 100%
            );
            pointer-events: none; z-index: 1;
        }

        /* Brilho pontual canto superior */
        .card::after {
            content: '';
            position: absolute;
            top: -20px; left: -20px;
            width: 150px; height: 150px;
            background: radial-gradient(
                circle at 20% 20%,
                rgba(255,255,255,0.07) 0%,
                rgba(255,255,255,0.02) 40%,
                transparent 65%
            );
            pointer-events: none; z-index: 1;
        }

        .card:hover, .card:active {
            transform: translateY(-3px);
            box-shadow:
                0 1px 0 rgba(255,255,255,0.28),
                -1px 0 0 rgba(255,255,255,0.14),
                1px 0 0 rgba(0,0,0,0.6),
                0 -1px 0 rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.10),
                inset 0 -2px 4px rgba(0,0,0,0.4),
                0 8px 16px rgba(0,0,0,0.55),
                0 24px 64px rgba(0,0,0,0.65),
                0 0 0 1px rgba(201,168,76,0.25),
                0 0 50px rgba(201,168,76,0.08);
        }
        .card:hover .card-icon, .card:active .card-icon { background:rgba(201,168,76,0.12); border-color:rgba(201,168,76,0.3); }
        .card:hover .card-icon svg, .card:active .card-icon svg { stroke:var(--gold-b); filter:drop-shadow(0 0 4px rgba(201,168,76,0.5)); }
        .card:hover .card-title, .card:active .card-title { color:var(--gold-b); }
        .card:hover .card-arrow, .card:active .card-arrow { opacity:1; transform:translateX(2px); }

        /* Conteúdo do card */
        .card-inner {
            position:relative; z-index:2;
            display:flex; align-items:center; gap:16px;
            width:100%; padding:17px 18px;
        }

        .card-icon {
            width:46px; height:46px; flex-shrink:0;
            border-radius:13px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            display:flex; align-items:center; justify-content:center;
            transition:all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .card-icon svg { width:19px; height:19px; stroke:rgba(245,240,232,0.5); transition:all 0.3s ease; }

        .card-text { flex:1; min-width:0; }
        .card-title {
            font-size:0.75em; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
            color:rgba(245,240,232,0.9); margin-bottom:4px;
            transition:color 0.3s ease;
        }
        .card-sub { font-size:0.58em; color:var(--text-dim); letter-spacing:0.3px; }

        .card-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }

        .card-num {
            font-family:'Cormorant Garamond',serif;
            font-size:0.65em; font-weight:300;
            color:rgba(201,168,76,0.25); letter-spacing:1px;
        }

        .card-arrow {
            color:rgba(201,168,76,0.7); opacity:0;
            transition:all 0.3s ease;
        }
        .card-arrow svg { width:14px; height:14px; }

        /* Linha dourada esquerda no hover */
        .card-accent {
            position:absolute; left:0; top:20%; bottom:20%; z-index:3;
            width:2px;
            background:linear-gradient(transparent, var(--gold), transparent);
            border-radius:2px;
            opacity:0;
            transition:opacity 0.3s ease;
        }
        .card:hover .card-accent, .card:active .card-accent { opacity:1; }

        /* Delays das animações */
        .card:nth-child(1) { animation-delay:0.08s; }
        .card:nth-child(2) { animation-delay:0.16s; }
        .card:nth-child(3) { animation-delay:0.24s; }
        .card:nth-child(4) { animation-delay:0.32s; }
        .card:nth-child(5) { animation-delay:0.40s; }

        /* ── FOOTER ── */
        .footer { margin-top:48px; text-align:center; animation:fadeUp 0.5s 0.5s ease both; }
        .footer-txt { font-size:0.52em; letter-spacing:4px; text-transform:uppercase; color:rgba(245,240,232,0.18); }
        .footer-hr { width:36px; height:1px; background:rgba(201,168,76,0.2); margin:8px auto 0; }

        /* ── ANIMAÇÕES ── */
        @keyframes pulse   { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
        @keyframes fadeUp  { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }

        @media (max-width:400px) {
            .brand { font-size:3em; letter-spacing:12px; }
            .page  { padding:44px 14px 44px; }
            .card-inner { padding:15px 14px; }
        }
    </style>
</head>
<body>

            <div class="card-accent"></div>
            <div class="card-inner">

        <a href="comando.html" class="card">
